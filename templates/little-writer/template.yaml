schemaVersion: 1
slug: little-writer
name: little writer
summary: A shared Markdown editor in Etherpad's clothes, with line numbers, authorship colors, chat, a timeslider and passage comments your agent can answer.
description: |
  little writer is a shared Markdown editor styled after Etherpad. Write in iA Writer Duo with a formatting toolbar, line numbers in the margin and authorship colors behind every author's text. Open the users list to set your name and color, chat beside the document, save revisions and scrub through them with the timeslider, and import or export Markdown, plain text or HTML.
  Comments anchor to passages and live in a sidebar with open, resolved and label tabs. Your agent can leave and answer them, because documents, comments, chat and revisions are ordinary Tonk data. Documents sit in a drawer with folders, sorting, rename, reveal and delete; the drawer heading takes the space name.
category: Writing
version: 2.0.0
license: MIT
author:
  name: Goblin Oats
  url: https://github.com/goblinoats
  contact: null
features:
  - Etherpad-style toolbar for bold, italic, strikethrough, highlight, code, headings, lists, links and comments
  - Line numbers in the margin and authorship colors behind each author's text
  - Users list with names and colors, and per-document chat, floating or docked beside the comments
  - Revisions saved automatically or with a star, browsable with the timeslider and restorable
  - Import Markdown or text; export Markdown, plain text, HTML or a printout
  - Anchored comments with threads, resolve and labels, readable and writable by agents
  - Document drawer with folders, sorting, rename, reveal and delete
images:
  - file: preview.png
    alt: little writer with the document drawer, the editor with line numbers and authorship colors, and the comments sidebar
    caption: The editor with the document drawer, line numbers, authorship colors and the comments sidebar open.
  - file: focused.png
    alt: little writer with the drawers closed, showing the toolbar, line numbers and the document
    caption: The same document with the drawers closed for focused writing.
files:
  - file: app.yaml
    description: Complete self-contained app - schemas, portal view, embedded fonts (iA Writer Duo, Quicksand), Lucide icons and editor code; no document, comment or chat data
entrypoint: writer-app
compatibility: Tonk CLI 0.6.15. A self-contained Tonk portal app (the portal bridge supplies identity and data); no build step or external runtime assets.
notes: |
  Install into a fresh space with tonk eval app.yaml --home writer-app. Opening the app creates a blank document and three comment labels; the YAML carries no documents, comments, chat, revisions or authorship. Re-evaluation updates the app, its views and schemas without touching existing data. writer-app is its own concept (attributes under xyz.tonk.writer.app), so tonk space home writer-app works and a Tonk seed update cannot overwrite its view; if a seed update resets the space home, re-pin it with tonk space home writer-app.
  Deleting a document or folder moves its writer-node under the parent writer:trash; clients hide trashed items and nothing is retracted. Restore one with tonk assert writer-node <id> --parent writer:root, and treat nodes parented to writer:trash as deleted when listing documents from the CLI. The drawer heading defaults to the space name and is stored in writer-workspace once renamed.
  Concurrent edits to one document are whole-document last-writer-wins, with the losing version preserved as a "(conflicting edits)" document; there is no character-level merging. Fonts iA Writer Duo and Quicksand are under the SIL Open Font License 1.1 and the Lucide icons under the ISC license; notices are in LICENSE.txt and inside app.yaml. The app was verified with Tonk CLI 0.6.15 in the Tonk desktop client and in Chromium.
