concept!: &export/compiled-0f06f7da80f66d92
  this: id:dashboard-rc-1/export/compiled-0f06f7da80f66d92
  description: "A user-published name — an `id:<n>` entity carrying a single `entity` claim that points at the target the name currently identifies.  `this` is derived from the name string by prefixing `id:`. `entity` is the target. Asserting two `Name` claims for the same `this` with different `entity` values supersedes the prior claim because the backing attribute is cardinality one."
  with:
    entity:
      the: db.name/referent
      as: entity
      cardinality: one
      description: "The `db.name/referent` attribute — the entity a name currently points at. Cardinality `one` (the derive default), so re-pointing a name supersedes the prior claim instead of accumulating."

