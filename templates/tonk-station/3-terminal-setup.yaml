              if (!KEY_RE.test(key)) continue;   // foreign-named sessions can't be entities
              const born = live.created * 1000;
              const seen = live.activity * 1000; // last activity — seen bumps only on
                                                 // change, keeping abandonment visible
              const cur = proj.state.get(key);
              if (!cur) {
                const row = {
                  key,
                  title: titleHints.get(key) ?? live.cmd ?? "",
                  origin: originHints.get(key) ?? "tmux",
                  status: "running", born, seen, endedAt: 0,
                };
                docs.push(rowDoc(row));
                commits.push(() => { proj.state.set(key, row); log(`term ${key} projected(${row.origin})`); });
              } else {
                const next = {
                  title: titleLocked.has(key) ? cur.title : (live.cmd || cur.title),
                  origin: originHints.get(key) ?? cur.origin,   // a re-create may re-origin
                  status: "running", born, seen,
                };
                // `seen` drifts with every keystroke, and rewriting the row for
                // that is not free: each row is rendered in the deck, and a card
                // that re-renders tears down its terminal. Sub-minute precision
                // buys nothing — the launcher says "11m ago" — so only a real
                // drift (or a meaningful field) is worth a write. Measured
                // 2026-08-05: without this, using one terminal rebuilt EVERY
                // terminal card every 2s, and only the newest survived the race.
                const seenDrift = Math.abs(next.seen - cur.seen) >= seenEpsMs;
                if (next.title !== cur.title || next.origin !== cur.origin ||
                    cur.status !== "running" || next.born !== cur.born || seenDrift) {
                  const resurrected = cur.status !== "running";
                  docs.push(rowDoc({ key, ...next }));
                  commits.push(() => {
                    Object.assign(cur, next, { endedAt: 0 });
                    if (resurrected) log(`term ${key} projected(${cur.origin}) — resurrected`);
                  });
                }
              }
            }
            for (const r of proj.state.values()) {
              if (r.status === "running" && !res.sessions.has(r.key)) {
                // Killed on request → the row goes now. Ended by itself →
                // marked exited and kept for the retention window.
                if (killedForget.has(r.key)) {
                  docs.push(rowGone(r.key));
                  commits.push(() => {
                    proj.state.delete(r.key);
                    killedForget.delete(r.key);
                    originHints.delete(r.key); titleHints.delete(r.key); titleLocked.delete(r.key);
                    log(`term ${r.key} killed — row retracted`);
                  });
                } else {
                  docs.push(rowDoc({ ...r, status: "exited" }));
                  commits.push(() => { r.status = "exited"; r.endedAt = now; log(`term ${r.key} exited`); });
                }
              }
            }
          }
          for (const r of [...proj.state.values()]) {   // RETAIN_EXITED, then forgotten
            if (r.status !== "running" && r.endedAt && now - r.endedAt > retainExitedMs) {
              docs.push(rowGone(r.key));
              commits.push(() => {
                proj.state.delete(r.key);
                originHints.delete(r.key); titleHints.delete(r.key); titleLocked.delete(r.key);
                log(`term ${r.key} retracted (retention)`);
              });
            }
          }
          if (docs.length) {
            await io.evalLocal(docs.join("\n"));   // one batched write, on change only
            io.markDirty();
            for (const fn of commits) fn();
          }
        } catch (e) {
          log(`projection error: ${e.message}`);
        } finally {
          proj.inFlight = false;
        }
      }
    
      // ---- socket door (PROTOCOL §4) -------------------------------------
    
      function clearStaleSocket() {
        return new Promise((resolveP, rejectP) => {
          if (!existsSync(socketPath)) return resolveP();
          const probe = net.connect(socketPath);
          const to = setTimeout(() => {
            probe.destroy();
            try { unlinkSync(socketPath); } catch { /* gone */ }
            resolveP();
          }, 500);
          probe.on("connect", () => {
            clearTimeout(to); probe.destroy();
            rejectP(new Error(`another hub is already serving ${socketPath}`));
          });
          probe.on("error", () => {
            clearTimeout(to);
            try { unlinkSync(socketPath); } catch { /* gone */ }
            resolveP();
          });
        });
      }
    
      function onSock(sock) {
        const rec = { id: `sock-${++sockSeq}`, kind: "socket", role: "consumer",
                      serveName: null, serveSeq: 0, sock, attachments: new Map(),
                      convs: new Set(), dead: false, buf: "" };
        conns.set(rec.id, rec);
        log(`socket client ${rec.id} connected`);
        greet(rec);
        sock.on("data", (chunk) => {
          rec.buf += chunk.toString("utf8");   // no maximum line length assumed
          let nl;
          while ((nl = rec.buf.indexOf("\n")) >= 0) {
            const line = rec.buf.slice(0, nl);
            rec.buf = rec.buf.slice(nl + 1);
            if (!line.trim()) continue;
            let obj;
            try { obj = JSON.parse(line); } catch { continue; }        // dropped silently
            if (!obj || typeof obj !== "object") continue;
            if (typeof obj.c === "string") {
              handleOp(rec, obj).catch((e) => log(`op ${obj.c} failed: ${e.message}`));
            } else if (typeof obj.t === "string") {
              routeFrame(rec, obj, line);
            }                                                          // neither key: dropped
          }
        });
        const bye = () => {
          if (rec.dead) return;
          log(`socket client ${rec.id}${rec.serveName ? ` (${rec.serveName})` : ""} disconnected`);
          dropConn(rec, "sock-closed");
        };
        sock.on("close", bye);
        sock.on("error", bye);
      }
    
      async function handleOp(rec, op) {
        const reply = (extra) =>
          sendFrame(rec, { c: op.c, ...(op.id !== undefined ? { id: op.id } : {}), ...extra });
        switch (op.c) {
          case "new": {
            if (!terminal) { reply({ ok: false, error: "terminals are not enabled on this hub (start it with --terminal)" }); return; }
            if (!tmuxInfo.ok) { reply({ ok: false, error: `tmux unavailable: ${tmuxInfo.why}` }); return; }
            const key = (op.key === undefined || op.key === null || op.key === "") ? mintKey() : String(op.key);
            if (!KEY_RE.test(key)) { reply({ ok: false, error: "malformed session key" }); return; }
            const live = broker.liveSessions();
            if (live.includes(key)) { reply({ ok: true, key }); return; }   // idempotent; create-args ignored
            if (maxSessions > 0 && live.length >= maxSessions) {
              reply({ ok: false, error: `session cap reached (--max-sessions ${maxSessions})` });
              return;
            }
            try {
              broker.configureNamespace();
              const argv = ["-L", ns, "new-session", "-d", "-s", key,
                "-c", (typeof op.cwd === "string" && op.cwd) || terminalCwd,
                (typeof op.cmd === "string" && op.cmd) || terminalShell];
              execFileSync(TMUX, argv, { env: terminalEnvironment(), stdio: ["ignore", "ignore", "pipe"] });
            } catch (e) {
              reply({ ok: false, error: `tmux new-session failed: ${String(e.stderr || e.message).trim().slice(0, 200)}` });
              return;
            }
            originHints.set(key, `socket:${rec.serveName ?? rec.id}`);
            if (typeof op.title === "string" && op.title) { titleHints.set(key, op.title); titleLocked.add(key); }
            log(`term ${key} created via new (${rec.serveName ?? rec.id})`);
            reply({ ok: true, key });
            projectionTick().catch(() => {});     // surface the row promptly
            return;
          }
          case "ls": {
            const sessions = [...proj.state.values()].map((r) => ({
              key: r.key, title: r.title, origin: r.origin, status: r.status,
              born: r.born, seen: r.seen,
            }));
            reply({ ok: true, sessions });
            return;
          }
          case "kill": {
            const key = String(op.key ?? "");
            if (!KEY_RE.test(key)) { reply({ ok: false, error: "malformed session key" }); return; }
            if (!tmuxInfo.ok) { reply({ ok: false, error: `tmux unavailable: ${tmuxInfo.why}` }); return; }
            broker.kill(key);
            reply({ ok: true });                  // idempotent, even if already gone
            return;
          }
          case "serve": {
            const name = String(op.name ?? "").trim();
            if (!name || name.length > 100 || !/^[a-z0-9:._-]+$/i.test(name)) {
              reply({ ok: false, error: "bad service name" });
              return;
            }
            const first = rec.role !== "service";
            const changed = rec.serveName !== name;
            rec.role = "service";
            if (first) rec.serveSeq = ++serveSeq;   // attach order sticks across rename
            rec.serveName = name;
            reply({ ok: true });
            if (first || changed) {
              log(`client attached ${name} (${rec.id})`);
              broadcastServices();
            }
            return;
          }
          case "attach": {
            const key = String(op.key ?? "");
            const why = broker.admitOpen(rec, key);
            if (why) { reply({ ok: false, error: why }); return; }     // same info as term-deny
            reply({ ok: true, key });
            broker.open(rec, key, op.cols ?? 80, op.rows ?? 24, undefined, undefined);
            return;
          }
          // ---- branch door: the ONLY write path to this spot's store ------
          // Local processes (the responder, live.mjs) do their branch I/O
          // here instead of shelling out — see the branchOp comment above for
          // why single-writer is not negotiable. These run through the hub's
          // existing seam: `assert` = evalLocal + markDirty (local commit,
          // pushed by the one sync loop), `query` = the flat-array-tolerant
          // read, `sync` = jump the push queue for a latency-sensitive write.
          case "assert": {
            const doc = typeof op.notation === "string" ? op.notation : "";
            if (!doc.trim()) { reply({ ok: false, error: "assert needs a notation string" }); return; }
            if (doc.length > MAX_NOTATION) {
              reply({ ok: false, error: `notation too large (${doc.length} > ${MAX_NOTATION})` });
              return;
            }
            try {
              await branchOp(async () => { await io.evalLocal(doc); io.markDirty(); });
              reply({ ok: true });
            } catch (e) {
              reply({ ok: false, error: `assert failed: ${e.message}` });
            }
            return;
          }
          case "query": {
            const concept = String(op.concept ?? "").trim();
            if (!CONCEPT_RE.test(concept)) { reply({ ok: false, error: "malformed concept" }); return; }
            try {
              const rows = await branchOp(() => io.query(concept));
              reply({ ok: true, rows: Array.isArray(rows) ? rows : [] });
            } catch (e) {
              reply({ ok: false, error: `query failed: ${e.message}` });
            }
            return;
          }
          case "sync": {
            io.publishNow();                  // expedited push; the loop owns the network
            reply({ ok: true, queued: true });
            return;
          }
          default:
            reply({ ok: false, error: "unknown op" });
        }
      }
    
      // ---- beat: REMOVED (2026-08-09) -------------------------------------
      // The hub kept an agent/presence row under thread "hub" and rewrote it
      // every heartbeat. That write cadence — not the payload — is what grew
      // the store 20 GB in three days (POSTMORTEM-2026-08-08), and the wire
      // now gates dialing on rendered slots instead of beat freshness. What
      // remains is boot hygiene: retract any thread="hub" row a pre-removal
      // hub left behind, so no chip renders a forever-stale hub presence.
      async function sweepHubPresence() {
        try {
          const rows = (await io.query("agent/presence")).filter((r) => String(r.thread) === "hub");
          if (!rows.length) return;
          await io.evalLocal(rows.map((r) => `agent/presence!:\n  this: ${r.this}\n  ..: _\n`).join("\n"));
          io.markDirty();
          log(`swept ${rows.length} legacy hub presence row(s) — the heartbeat is gone`);
        } catch (e) { log(`hub presence sweep failed (harmless, retried next boot): ${e.message}`); }
      }
    
      // ---- lifecycle ------------------------------------------------------
    
      function hbLog() {
        const all = [...conns.values()];
        const rtc = all.filter((c) => c.kind === "rtc").length;
        const sock = all.filter((c) => c.kind === "socket").length;
        const running = [...proj.state.values()].filter((r) => r.status === "running").length;
        // Sync health belongs in the line someone reads when the deck looks
        // dead: the branch is the signalling channel, so "hub fine locally,
        // pushes silently failing" IS an outage and must say so here.
        const hs = io.health?.();
        const age = (t) => (t ? `${Math.round((Date.now() - t) / 1000)}s ago` : "never");
        const side = (n, h) => (h.streak
          ? `${n} FAILING x${h.streak} (ok ${age(h.okAt)}; ${h.error.slice(0, 90)})`
          : `${n} ok ${age(h.okAt)}`);
        log(`hb: conns rtc=${rtc} sock=${sock} services=${serviceList().length} sessions=${running} · ` +
            `slots=${counters.slots}/${freeSlots().length}free answers=${counters.answers} ` +
            `opens=${counters.opens} closes=${counters.closes} stale=${counters.stale} ` +
            `swept=${counters.sweeps}` +
            (hs ? ` · ${side("pull", hs.pull)} · ${side("push", hs.push)}` : ""));
      }
    
      async function start() {
        if (terminal && !tmuxInfo.ok)
          throw new Error(`--terminal refused: ${tmuxInfo.why}. Terminals need tmux ≥3.2 on PATH (or /opt/homebrew/bin).`);
        if (!ndcOpt) log("answerer off — node-datachannel unavailable; socket door only");
        await clearStaleSocket();
        for (const row of await io.query('session/label').catch(() => []))
          sessionLabels.set(`${row.kind}:${row.key}`, { kind: row.kind, key: row.key, title: row.title });
        await new Promise((resolveP, rejectP) => {
          server = net.createServer(onSock);
          server.on("error", rejectP);
          server.listen(socketPath, () => { server.on("error", (e) => log(`socket server error: ${e.message}`)); resolveP(); });
        });
        await seedProjection();
        await sweepHubPresence();
        // Boot: every rtc/signal row on the branch is now litter — v2 calls and
        // accepts, and slots belonging to a hub instance that no longer exists
        // (this one has a fresh `hubId`). Sweep first, THEN mint, so the pool
        // the tabs see is entirely answerable. Since the heartbeat's removal
        // this sweep is also the liveness story: a rendered slot means "a hub
        // published this and no hub has swept it since".
        await retractRtc(() => true).catch(() => {});
        await slotTick();
        if (tmuxInfo.ok) await projectionTick(); // boot reconcile (catches lost-at-boot)
        if (tmuxInfo.ok) await sessionsTick();   // …and a live list before the first tab
        timers.add(setInterval(() => { slotTick().catch(() => {}); }, rtcPollMs));
        timers.add(setInterval(pingTick, pingMs));   // reloaded tabs never close their channel
        if (tmuxInfo.ok) timers.add(setInterval(() => { projectionTick().catch(() => {}); }, projectionMs));
        if (tmuxInfo.ok) timers.add(setInterval(() => { sessionsTick().catch(() => {}); }, sessionsMs));
        timers.add(setInterval(hbLog, hbLogMs));
        log(`hub up: spot ${spot} · agent ${agent} · socket ${socketPath} · ns ${ns} · ` +
            `terminals ${terminal ? `on (${terminalShell})` : "off"} · answerer ${ndcOpt ? "on" : "off"}` +
            `${turn ? ` · turn ${turn}` : ""}${maxSessions ? ` · max-sessions ${maxSessions}` : ""}` +
            `${tmuxInfo.ok ? ` · ${tmuxInfo.version}` : ` · no tmux (${tmuxInfo.why})`}`);
      }
    
      async function stop() {
        if (stopping) return;
        stopping = true;
        for (const h of timers) clearInterval(h);
        timers.clear();
        for (const rec of [...conns.values()]) dropConn(rec, "shutdown");
        broker.stopChild();
        if (server) { await new Promise((r) => server.close(() => r())); server = null; }
        try { unlinkSync(socketPath); } catch { /* gone */ }
        // Take the invitations down on the way out. A slot outliving its hub is
        // a trap: the PeerConnection behind it is gone, so a tab that answers it
        // waits for a peer that cannot arrive. The `hubId` prefix is the backstop
        // for the times this does not run (a kill -9, a crash).
        await retractRtc((r) => String(r.session ?? "").startsWith(`${hubId}-`)).catch(() => {});
        slots.clear();
        log("hub stopped");
      }
    
      return {
        start, stop,
        // exposed for the harness:
        slotTick, projectionTick, sessionsTick, pingTick,
        conns, proj, counters, broker, slots,
        socketPath, ns, tmuxInfo,
      };
    }
    
    // ---- CLI --------------------------------------------------------------
    
    async function main() {
      const args = parseArgs(process.argv.slice(2));
      if (!args.spot) {
        console.error("usage: bun agent/hub.mjs --spot <spot> [--terminal] [--terminal-shell sh] " +
                      "[--terminal-cwd dir] [--turn url] [--max-sessions n] [--agent name]");
        process.exit(1);
      }
      const log = defaultLog;
      const io = createBranchIO({
        spot: args.spot, log,
        syncGapMs: numArg(args.syncgap, 1200),
        // A push is ~48s on this store, so at a 60s gate the write lane was
        // pushing ~45% of the time and every local write queued behind it.
        // With the heartbeat gone this gate only coalesces event-driven dirty
        // writes (projection churn, sweeps); anything a caller waits on goes
        // through publishNow and skips it entirely.
        beatPushMs: numArg(args.beatpush, 90000),
        noSync: !!args.noSync,
      });
      const hub = createHub({
        io, spot: args.spot,
        agent: args.agent ?? shortHostname(),
        terminal: !!args.terminal,
        terminalShell: args["terminal-shell"] ?? process.env.SHELL ?? "/bin/sh",
        terminalCwd: args["terminal-cwd"] ?? process.env.HOME,
        turn: args.turn ?? null,
        maxSessions: numArg(args["max-sessions"], 0),
        rtcPollMs: numArg(args.poll, 1500),
        projectionMs: numArg(args.projection, 2000),
        pingMs: numArg(args.ping, 15000),
        log,
      });
      try {
        await io.start();          // pull first: the calls were placed in a browser
        await hub.start();
      } catch (e) {
        console.error(String(e && e.message || e));
        process.exit(1);
      }
      let stopping = false;
      const shutdown = async (sig) => {
        if (stopping) return;
        stopping = true;
        log(`${sig} — shutting down`);
        try { await hub.stop(); } catch { /* best effort */ }
        try { await io.stop(); } catch { /* best effort */ }
        try { ndc?.cleanup(); } catch { /* once, at shutdown */ }
        process.exit(0);
      };
      process.on("SIGINT", () => shutdown("SIGINT"));
      process.on("SIGTERM", () => shutdown("SIGTERM"));
    }
    
    const isMain = (() => {
      try { return process.argv[1] && pathResolve(process.argv[1]) === fileURLToPath(import.meta.url); }
      catch { return false; }
    })();
    if (isMain) main().catch((e) => { console.error(e); process.exit(1); });
    

terminal/setup-file!:
  this: id:terminal/setup-file/1.0.0/agent/pty-host.mjs
  version: "1.0.0"
  path: "agent/pty-host.mjs"
  sha256: "7c66b88dee7947d1fab83592187a9b6914e4f048b9df595c12108163479a44d4"
  content: |
    #!/usr/bin/env node
    // pty-host — hosts thin tmux CLIENTS (not shells) for terminal cards.
    // SPEC §11: one attachment = one `tmux -L <ns> new-session -A -s <key>`
    // under its own small PTY. Detach kills only the client; the session
    // notices nothing. Mirroring is tmux multi-client (`window-size latest`).
    // The exact-screen redraw on reattach replaces v1's escape-replay ring.
    //
    // Not a standalone tool: the agent spawns this and talks to it over
    // stdin/stdout. Run it by hand only to debug (it will sit waiting for
    // newline-delimited JSON on stdin).
    //
    // WHY IT IS A SEPARATE PROCESS, AND WHY IT IS NODE.
    // `node-pty`'s prebuilt binary loads fine under bun, but opening the pty
    // slave fails with ENXIO — measured 2026-08-04, inside and outside the
    // sandbox, so it is bun's libuv seam and not something a flag fixes. Under
    // node 22 the identical script works. The agent needs bun (that is where
    // the datachannel and the whole chat lives), so the ptys live here instead
    // and the two speak over pipes.
    //
    // CONFIG — tmux namespace (the `-L` socket name): argv[2], else
    // $TONK_TMUX_NS, else "tonk-default". Isolated from the user's own tmux
    // by construction; every option we set is on this socket only.
    //
    // PROTOCOL — one JSON object per line, both directions.
    //   in:  {c:"open",   session, cols, rows, cmd?, cwd?}
    //            attach-or-create: `new-session -A -s <session>`; cmd (string
    //            or argv array) and cwd apply only when the session does not
    //            exist yet. Every open spawns a NEW client; the reply carries
    //            its client id. Multiple opens on one key = mirrored clients.
    //   in:  {c:"in",     client|session, d}          d = base64 keystrokes
    //   in:  {c:"resize", client|session, cols, rows}
    //   in:  {c:"close",  client|session}   kill client PTY(s) only = detach;
    //                                       the tmux session keeps running
    //   in:  {c:"kill",   session}          tmux kill-session (session dies;
    //                                       its clients get exit events)
    //   out: {e:"ready",  ns}                          once, at startup
    //   out: {e:"open",   client, session}             reply to open
    //   out: {e:"out",    client, session, d}          d = base64 pty output
    //   out: {e:"exit",   client, session, code, signal, reason}
    //            reason: "close"         — we killed this client (c:"close",
    //                                      shutdown sweep)
    //                    "detached"      — tmux detached it (prefix-d, or a
    //                                      detach-client from outside)
    //                    "session-ended" — the session itself died (exit or
    //                                      kill-session)
    //                    "server-lost"   — the tmux server went away
    //                    "unknown"       — client died without a recognisable
    //                                      tmux sign-off
    //   out: {e:"killed", session}                     reply to kill
    //   out: {e:"error",  msg, client?, session?}
    //
    // Addressing: "in" by session writes to ONE client (tmux mirrors input
    // from any client, so writing to all would double keystrokes); "resize"
    // and "close" by session apply to all of the session's clients.
    //
    // Payloads are base64 because a pty emits BYTES: a UTF-8 sequence can be
    // split across two reads, and decoding each read as a string would corrupt
    // it. Raw bytes go all the way to xterm.js, which reassembles them.
    
    import { createInterface } from "node:readline";
    import { accessSync, chmodSync, constants, statSync } from "node:fs";
    import { execFile } from "node:child_process";
    import { createRequire } from "node:module";
    import { delimiter, dirname, join } from "node:path";
    import { configureTerminalNamespace, terminalEnvironment } from './terminal-config.mjs';
    
    const require = createRequire(import.meta.url);
    
    function send(obj) {
      process.stdout.write(JSON.stringify(obj) + "\n");
    }
    
    // node-pty spawns a small `spawn-helper` binary on unix. Its prebuilt copy
    // arrives without the executable bit when the install skipped lifecycle
    // scripts — which is bun's default (`trustedDependencies` opts back in).
    // The symptom is a bare "posix_spawnp failed" from deep inside the addon,
    // so fix it here rather than depending on how the tree was installed.
    function ensureHelperExecutable() {
      try {
        const root = dirname(require.resolve("node-pty/package.json"));
        const dir = join(root, "prebuilds", `${process.platform}-${process.arch}`);
        const helper = join(dir, "spawn-helper");
        const mode = statSync(helper).mode;
        if (!(mode & 0o111)) chmodSync(helper, (mode | 0o755) & 0o7777);
      } catch { /* windows, or a source build — nothing to fix */ }
    }
    
    let pty;
    try {
      ensureHelperExecutable();
      pty = (await import("node-pty")).default;
    } catch (e) {
      send({ e: "error", msg: `node-pty unavailable: ${e.message}` });
      process.exit(1);
    }
    
    // ---- config -----------------------------------------------------------
    
    const NS = process.argv[2] || process.env.TONK_TMUX_NS || "tonk-default";
    if (!/^[A-Za-z0-9._@-]+$/.test(NS)) {
      send({ e: "error", msg: `bad tmux namespace: ${JSON.stringify(NS)}` });
      process.exit(1);
    }
    
    // tmux via PATH, with the known homebrew install as fallback (3.5a lives
    // there; a launchd-started parent may not have /opt/homebrew on PATH).
    function resolveTmux() {
      const dirs = (process.env.PATH || "").split(delimiter).filter(Boolean);
      dirs.push("/opt/homebrew/bin");
      for (const d of dirs) {
        const p = join(d, "tmux");
        try { accessSync(p, constants.X_OK); return p; } catch { /* keep looking */ }
      }
      return null;
    }
    const TMUX = resolveTmux();
    if (!TMUX) {
      send({ e: "error", msg: "tmux not found (PATH + /opt/homebrew/bin)" });
      process.exit(1);
    }
    
    const MAX_CLIENTS = Number(process.env.TONK_TERM_MAX || 16);
    
    // ---- namespace config (first contact) ---------------------------------
    // `set -g …` needs a live server, and a naked `start-server` exits again
    // the moment the command sequence ends (exit-empty defaults on) — so a
    // plain `start-server \; set …` chain configures a server that is gone
    // before the first new-session. Turning exit-empty off IN THE SAME chain
    // pins the server, so the options are in place before any session exists
    // and the very first drawn frame already has no status bar. All of it is
    // namespace-global on the tonk socket only; the user's tmux never sees it.
    // Idempotent, so "once per pty-host lifetime" is enough — a restarted
    // pty-host re-applies onto an already-configured server harmlessly.
    let nsConfigured = false;
    function configureNamespace() {
      if (nsConfigured) return;
      configureTerminalNamespace(TMUX, NS);
      nsConfigured = true;
    }
    
    // ---- clients ----------------------------------------------------------
    
    let nextClient = 1;
    const clients = new Map();   // client id -> { proc, session, closing, tail }
    
    const clamp = (n, lo, hi, dflt) => {
      const v = Math.round(Number(n));
      return Number.isFinite(v) ? Math.min(hi, Math.max(lo, v)) : dflt;
    };
    
    // tmux prints a sign-off into the client just before it exits; it is the
    // only way to tell a detach from a session death from this side.
    function exitReason(rec) {
      if (rec.closing) return "close";
      const t = rec.tail;
      if (t.includes("[detached")) return "detached";
      if (t.includes("[server exited") || t.includes("[lost server]") ||
          t.includes("server exited unexpectedly")) return "server-lost";
      if (t.includes("[exited]") || t.includes("(exited)")) return "session-ended";
      return "unknown";
    }
    
    function open({ session, cols, rows, cmd, cwd }) {
      if (typeof session !== "string" || !session || /[:.\s]/.test(session)) {
        send({ e: "error", session, msg: `bad session name: ${JSON.stringify(session)}` });
        return;
      }
      if (clients.size >= MAX_CLIENTS) {
        send({ e: "error", session, msg: `too many clients (${MAX_CLIENTS})` });
        return;
      }
      try {
        configureNamespace();
      } catch (err) {
        send({ e: "error", session, msg: `tmux server config failed: ${String(err.stderr || err.message).trim()}` });
        return;
      }
      // -A = attach-or-create; -c and the trailing command only take effect
      // when the session does not exist yet — exactly the semantics we want.
      const args = ["-L", NS, "new-session", "-A", "-s", session];
      if (typeof cwd === "string" && cwd) args.push("-c", cwd);
      if (Array.isArray(cmd)) args.push(...cmd.map(String));
      else if (typeof cmd === "string" && cmd) args.push(cmd);
    
      let proc;
      try {
        proc = pty.spawn(TMUX, args, {
          name: "xterm-256color",
          cols: clamp(cols, 20, 500, 80),
          rows: clamp(rows, 5, 200, 24),
          cwd: (typeof cwd === "string" && cwd) || process.env.HOME,
          env: terminalEnvironment(),
          // Bytes, not strings: see the header. node-pty hands back Buffers
          // when the encoding is null, and they go over the wire as base64.
          encoding: null,
        });
      } catch (err) {
        send({ e: "error", session, msg: `tmux client spawn failed: ${err.message}` });
        return;
      }
      const client = `c${nextClient++}`;
      const rec = { proc, session, closing: false, tail: "" };
      clients.set(client, rec);
      send({ e: "open", client, session });
      proc.onData((data) => {
        const buf = Buffer.from(data);
        rec.tail = (rec.tail + buf.toString("utf8")).slice(-512);
        send({ e: "out", client, session, d: buf.toString("base64") });
      });
      proc.onExit(({ exitCode, signal }) => {
        clients.delete(client);
        send({
          e: "exit", client, session,
          code: exitCode, signal: signal ?? null, reason: exitReason(rec),
        });
      });
    }
    
    function kill({ session }) {
      if (typeof session !== "string" || !session) {
        send({ e: "error", session, msg: "kill needs a session" });
        return;
      }
      // `=` pins exact-match — plain -t would prefix-match "s1" to "s10".
      execFile(TMUX, ["-L", NS, "kill-session", "-t", "=" + session],
        (err, _stdout, stderr) => {
          if (err) send({ e: "error", session, msg: String(stderr || err.message).trim() });
          else send({ e: "killed", session });
        });
    }
    
    // client id wins over session; session addresses all its clients.
    function targets(msg) {
      if (msg.client != null) {
        const rec = clients.get(msg.client);
        return rec ? [[msg.client, rec]] : [];
      }
      if (msg.session != null) {
        return [...clients].filter(([, r]) => r.session === msg.session);
      }
      return [];
    }
    
    function handle(msg) {
      switch (msg.c) {
        case "open": return open(msg);
        case "kill": return kill(msg);
        case "in": {
          const [first] = targets(msg);          // one client only: tmux
          if (!first) break;                     // mirrors input server-side
          if (typeof msg.d === "string") first[1].proc.write(Buffer.from(msg.d, "base64"));
          return;
        }
        case "resize": {
          const t = targets(msg);
          if (!t.length) break;
          for (const [, rec] of t) {
            try {
              rec.proc.resize(clamp(msg.cols, 20, 500, 80), clamp(msg.rows, 5, 200, 24));
            } catch { /* raced with exit */ }
          }
          return;
        }
        case "close": {
          const t = targets(msg);
          if (!t.length) break;
          for (const [, rec] of t) {
            rec.closing = true;
            try { rec.proc.kill(); } catch { /* already gone */ }
          }
          return;
        }
        default:
          send({ e: "error", msg: `unknown command: ${JSON.stringify(msg.c)}` });
          return;
      }
      // fallthrough from in/resize/close: nothing matched the address
      send({ e: "error", client: msg.client, session: msg.session, msg: "no such client/session" });
    }
    
    createInterface({ input: process.stdin }).on("line", (line) => {
      if (!line.trim()) return;
      let msg;
      try { msg = JSON.parse(line); } catch { return; }
      try { handle(msg); } catch (e) {
        send({ e: "error", client: msg.client, session: msg.session, msg: e.message });
      }
    });
    
    // The parent dying must not leave clients behind: stdin closing is the
    // signal, since the pipe outlives nothing. Killing a client is only a
    // DETACH — the tmux sessions keep running, which is the point (§15:
    // "hub restarts → sessions untouched").
    const detachAll = () => {
      for (const rec of clients.values()) {
        rec.closing = true;
        try { rec.proc.kill(); } catch { /* gone */ }
      }
      clients.clear();
    };
    process.stdin.on("close", () => { detachAll(); process.exit(0); });
    process.on("SIGTERM", () => { detachAll(); process.exit(0); });
    process.on("SIGINT", () => { detachAll(); process.exit(0); });
    
    send({ e: "ready", ns: NS });
    

terminal/setup-file!:
  this: id:terminal/setup-file/1.0.0/agent/terminal-config.mjs
  version: "1.0.0"
  path: "agent/terminal-config.mjs"
  sha256: "fa61b65c595e4fb1ce4447b5e319c61624c453492fb9926bf5ef4df2fd88cc6b"
  content: |
    import { execFileSync } from 'node:child_process';
    
    // The host may run under an automation tool that disables ANSI output. A
    // terminal card is an interactive, truecolor terminal with its own preferences.
    const colorOverrides = ['NO_COLOR', 'FORCE_COLOR', 'CLICOLOR', 'CLICOLOR_FORCE'];
    export function terminalEnvironment(base = process.env) {
      const env = { ...base, TERM: 'xterm-256color', COLORTERM: 'truecolor', TONK_TERMINAL: '1' };
      for (const key of colorOverrides) delete env[key];
      return env;
    }
    
    // Shared by attached PTYs and the hub's detached `new` operation. These
    // settings affect only the dedicated Tonk socket, never the user's tmux.
    export function configureTerminalNamespace(tmux, namespace) {
      const run = args => execFileSync(tmux, ['-L', namespace, ...args], {
        env: terminalEnvironment(), encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'],
      });
      run([
        'start-server',
        ';', 'set', '-s', 'exit-empty', 'off',
        ';', 'set', '-g', 'status', 'off',
        ';', 'set', '-g', 'window-size', 'latest',
        ';', 'set', '-g', 'default-terminal', 'tmux-256color',
        ';', 'set', '-g', 'history-limit', '10000',
        // tmux owns the alternate screen and its history. Mouse reporting lets
        // it scroll history (or forward the wheel to a mouse-aware application).
        // Without it, xterm translates wheel gestures into Up/Down keystrokes.
        ';', 'set', '-g', 'mouse', 'on',
        // The default first wheel only enters copy mode. Scroll immediately,
        // then use the same small step in both copy-mode key tables. -e exits
        // history automatically when the reader scrolls back to the bottom.
        ';', 'bind-key', '-n', 'WheelUpPane', 'if-shell', '-F',
        '#{||:#{pane_in_mode},#{mouse_any_flag}}', 'send-keys -M',
        'copy-mode -e; send-keys -X -N 3 scroll-up',
        ...['copy-mode', 'copy-mode-vi'].flatMap(table => [
          ';', 'bind-key', '-T', table, 'WheelUpPane', 'send-keys', '-X', '-N', '3', 'scroll-up',
          ';', 'bind-key', '-T', table, 'WheelDownPane', 'send-keys', '-X', '-N', '3', 'scroll-down',
        ]),
        // Also repair a server that was started before this configuration existed.
        ...colorOverrides.flatMap(key => [';', 'set-environment', '-gr', key]),
        ';', 'set-environment', '-g', 'COLORTERM', 'truecolor',
        ';', 'set-environment', '-g', 'TONK_TERMINAL', '1',
      ]);
      const feature = 'xterm-256color:256:RGB';
      const features = run(['show-options', '-sv', 'terminal-features']).trim().split('\n');
      if (!features.includes(feature)) {
        run(['set', '-as', 'terminal-features', ',' + feature]);
      }
    }
    

terminal/setup-file!:
  this: id:terminal/setup-file/1.0.0/agent/terminal-title.mjs
  version: "1.0.0"
  path: "agent/terminal-title.mjs"
  sha256: "e7d93b21b103b5268830c91dc7dd85a4c8efd18694682ebc8c3389de561f9dda"
  content: |
    // Prefer a meaningful application-supplied OSC title; otherwise show process
    // and directory. No screen scraping, model calls, or terminal-content storage.
    export function terminalTitle({ cmd = '', cwd = '', paneTitle = '' }, host = '') {
      const clean = value => String(value).replace(/[\x00-\x1f\x7f]/g, ' ').trim().slice(0, 120);
      const process = clean(cmd) || 'Shell';
      const directory = clean(cwd).split('/').filter(Boolean).pop() || '';
      const title = clean(paneTitle);
      if (title && title !== host && title !== cmd && title !== cwd && !/^\/?(?:dev\/)?ttys?\d+$/.test(title)) return title;
      return directory ? `${process} · ${directory}` : process;
    }
    

terminal/setup-file!:
  this: id:terminal/setup-file/1.0.0/agent/bus.mjs
  version: "1.0.0"
  path: "agent/bus.mjs"
  sha256: "92c2c60b0d390da79d5afa6415412c0ed86204a412e9bf2a02e946440e2aa685"
  content: |
    // The message bus: one envelope shape, pluggable channels, kind-based routing.
    //
    // Runners subscribe by kind ("simulation.run", "frame.*"). Channels are
    // adapters that speak one wire each (relay WebSocket, Tonk durable facts, a
    // local socket) and turn it into envelopes. A runner never sees which channel
    // delivered a message; a reply goes back through the channel that delivered
    // the request. The routing policy (which kinds leave through which channel)
    // is configuration on the bus, not knowledge in the callers.
    //
    // Envelope: { id, kind, payload, at, from?: { channel, peer }, to?, via?,
    //             replyTo?, durable?, live?, change?, reply(payload) }
    //
    // Delivery semantics are carried on the envelope, not hidden: a durable
    // envelope (from facts) may be redelivered after a restart, so its handler
    // must be idempotent; the bus itself drops repeats of a durable id it has
    // already delivered in this process. A live envelope (from a socket) is
    // best effort and point to point.
    
    export function matchesKind(pattern, kind) {
      if (pattern === '*' || pattern === kind) return true;
      if (pattern.endsWith('.*')) return kind.startsWith(pattern.slice(0, -1));
      return false;
    }
    
    let seq = 0;
    export const newId = (prefix = 'm') => `${prefix}-${Date.now().toString(36)}-${(++seq).toString(36)}-${Math.random().toString(36).slice(2, 7)}`;
    
    export function createBus({ log = () => {}, dedupeSize = 5000, now = () => Date.now() } = {}) {
      const subscribers = [];
      const channels = new Map();
      const routes = [];                     // { pattern, channel }
      const pending = new Map();             // request id -> { resolve, reject, timer }
      const seen = new Map();                // durable envelope id -> at
      const stats = { delivered: 0, dropped: 0, duplicates: 0, sent: 0, unrouted: 0 };
      let started = false;
    
      function remember(id) {
        seen.set(id, now());
        if (seen.size > dedupeSize) { const oldest = seen.keys().next().value; seen.delete(oldest); }
      }
      function envelope(kind, payload, extra = {}) {
        if (typeof kind !== 'string' || !/^[a-z][a-z0-9-]*(\.[a-z0-9*-]+)*$/i.test(kind)) throw new Error(`Bad envelope kind ${JSON.stringify(kind)}`);
        return { id: extra.id || newId(), kind, payload, at: now(), ...extra };
      }
      function bind(env) {
        // A reply follows the request back: to the peer, through the channel it came from.
        env.reply = (payload, extra = {}) => send(extra.kind || `${env.kind}.reply`, payload, { replyTo: env.id, to: env.from?.peer, via: env.from?.channel, ...extra });
        return env;
      }
    
      // Inbound: a channel (or a local emit) hands the bus an envelope.
      async function deliver(env) {
        if (env.durable && env.id && seen.has(env.id)) { stats.duplicates++; return { delivered: 0, duplicate: true }; }
        if (env.durable && env.id) remember(env.id);
        if (env.replyTo && pending.has(env.replyTo)) {
          const p = pending.get(env.replyTo); pending.delete(env.replyTo); clearTimeout(p.timer);
          if (env.error) p.reject(env.error instanceof Error ? env.error : new Error(String(env.error))); else p.resolve(env);
          return { delivered: 1, reply: true };
        }
        bind(env);
        const handlers = subscribers.filter(s => matchesKind(s.pattern, env.kind));
        if (!handlers.length) { stats.dropped++; return { delivered: 0 }; }
        let delivered = 0;
        for (const s of handlers) {
          try { await s.handler(env); delivered++; }
          catch (e) { log(`bus: handler for ${env.kind} failed: ${e.message}`); }
        }
        stats.delivered += delivered;
        return { delivered };
      }
    
      function channelFor(env) {
        if (env.via) return channels.get(env.via) || null;
        const route = routes.find(r => matchesKind(r.pattern, env.kind));
        return route ? channels.get(route.channel) || null : null;
      }
    
      // Outbound: route to a channel; with no route, deliver locally.
      async function send(kind, payload, extra = {}) {
        const env = envelope(kind, payload, extra);
        const channel = channelFor(env);
        if (!channel) {
          if (env.via) throw new Error(`bus: no channel named ${env.via}`);
          stats.unrouted++;
          await deliver(env);
          return env;
        }
        const ok = await channel.send(env);
        if (ok === false) throw Object.assign(new Error(`bus: channel ${channel.name} refused ${kind}`), { code: 'refused', envelope: env });
        stats.sent++;
        return env;
      }
      const emit = (kind, payload, extra = {}) => deliver(bind(envelope(kind, payload, extra)));
    
      function request(kind, payload, { timeoutMs = 30000, ...extra } = {}) {
        const env = envelope(kind, payload, extra);
        return new Promise((resolve, reject) => {
          const timer = setTimeout(() => { pending.delete(env.id); reject(Object.assign(new Error(`bus: no reply to ${kind} within ${timeoutMs}ms`), { code: 'timeout' })); }, timeoutMs);
          pending.set(env.id, { resolve, reject, timer });
          send(kind, payload, { ...extra, id: env.id }).catch(e => { pending.delete(env.id); clearTimeout(timer); reject(e); });
        });
      }
    
      function subscribe(pattern, handler) {
        if (typeof handler !== 'function') throw new Error('bus: subscribe needs a handler');
        const s = { pattern, handler };
        subscribers.push(s);
        return () => { const i = subscribers.indexOf(s); if (i >= 0) subscribers.splice(i, 1); };
      }
    
      async function addChannel(channel, { routes: patterns = [] } = {}) {
        if (!channel || typeof channel.name !== 'string' || typeof channel.send !== 'function') throw new Error('bus: a channel needs a name and send()');
        if (channels.has(channel.name)) throw new Error(`bus: channel ${channel.name} already added`);
        channels.set(channel.name, channel);
        for (const pattern of patterns) routes.push({ pattern, channel: channel.name });
        if (started && channel.start) await channel.start({ deliver, log });
      }
      async function removeChannel(name) {
        const channel = channels.get(name); if (!channel) return;
        channels.delete(name);
        for (let i = routes.length - 1; i >= 0; i--) if (routes[i].channel === name) routes.splice(i, 1);
        if (started && channel.stop) await channel.stop();
      }
      async function start() {
        started = true;
        for (const channel of channels.values()) if (channel.start) await channel.start({ deliver, log });
      }
      // Reject every outstanding request, for example when the link behind them dropped.
      function failPending(reason = 'link down') { for (const [id, p] of pending) { clearTimeout(p.timer); pending.delete(id); p.reject(Object.assign(new Error(reason), { code: 'link-down' })); } }
      async function stop() {
        started = false;
        for (const channel of [...channels.values()].reverse()) { try { if (channel.stop) await channel.stop(); } catch (e) { log(`bus: channel ${channel.name} stop failed: ${e.message}`); } }
        for (const [id, p] of pending) { clearTimeout(p.timer); p.reject(new Error('bus stopped')); pending.delete(id); }
      }
      return { subscribe, send, emit, request, deliver, addChannel, removeChannel, start, stop, failPending,
        channels: () => [...channels.keys()], routes: () => routes.map(r => ({ ...r })), kinds: () => subscribers.map(s => s.pattern), stats: () => ({ ...stats }) };
    }
    

terminal/setup-file!:
  this: id:terminal/setup-file/1.0.0/agent/relay-bridge.mjs
  version: "1.0.0"
  path: "agent/relay-bridge.mjs"
  sha256: "ff1f82c4d777276b586bb5ca8a8f02a3f7d74a242ec47ff9d2155994215909fd"
  content: |
    // The relay bridge, kept for callers of startRelayBridge: the relay channel
    // plus the hub socket bridge on a private bus. The host (agent/host.mjs)
    // wires the same two pieces itself; this file is the compatibility entry.
    import { createBus } from './bus.mjs';
    import { createRelayChannel, allowedFrame } from './channels/relay.mjs';
    import { createSocketBridge } from './runners/hub.mjs';
    export { allowedFrame };
    
    export function startRelayBridge({ url, room, token, socketPath, log = console.log }) {
      const bus = createBus({ log });
      const channel = createRelayChannel({ url, room, token, log });
      const bridge = createSocketBridge({ bus, socketPath, log, channel: channel.name });
      const started = bus.addChannel(channel, { routes: ['frame.*', 'peer.*'] }).then(() => bus.start()).then(() => bridge.start());
      started.catch(e => log('relay bridge failed to start: ' + e.message));
      return { close() { bridge.stop(); bus.stop().catch(() => {}); } };
    }
    

terminal/setup-file!:
  this: id:terminal/setup-file/1.0.0/agent/channels/relay.mjs
  version: "1.0.0"
  path: "agent/channels/relay.mjs"
  sha256: "1c3bf6cd1faf6975cbe6ca34ee26623ec8aa6cd7975abf2496ec94d0ad70d5ec"
  content: |
    // The relay channel: the Cloudflare session relay as a bus channel.
    //
    // Inbound: a browser peer's frame arrives as a live envelope of kind
    // "frame.<t>" with from.peer set; peer arrivals and departures are
    // "peer.open" and "peer.close". Outbound: a "frame.*" envelope with `to`
    // (the peer id) goes to that browser; "peer.detach" asks the relay to reset
    // a browser connection. The allowlist is the same one the relay enforces.
    
    import { connectSession } from '../../session/relay-client.mjs';
    
    export const ALLOWED_BROWSER_FRAMES = ['ping', 'pong', 'conv-open', 'conv-close', 'say', 'stop', 'permission-response', 'chat-model', 'session-rename', 'term-open', 'term-in', 'term-resize', 'term-close', 'term-kill', 'language-submit', 'language-cancel'];
    export const allowedFrame = f => f && typeof f === 'object' && !('c' in f) && ALLOWED_BROWSER_FRAMES.includes(f.t);
    
    export function createRelayChannel({ url, room, token, name = 'relay', connect = connectSession, log = () => {} } = {}) {
      if (!url || !room || !token) throw new Error('relay channel needs url, room and token');
      let link = null, deliver = null, status = 'stopped';
      const peers = new Set();
      return {
        name, capabilities: { durable: false, live: true }, status: () => status, peers: () => [...peers],
        async start(ctx) {
          deliver = ctx.deliver;
          link = connect({ url, room, token, role: 'host',
            onStatus(s, detail) {
              status = s;
              log(`relay host: ${s}${detail ? ` (${detail.code}: ${detail.reason})` : ''}`);
              if (s !== 'connected') { for (const peer of [...peers]) { peers.delete(peer); deliver({ id: undefined, kind: 'peer.close', payload: { peer, reason: 'relay-' + s }, at: Date.now(), from: { channel: name, peer }, live: true }); } }
            },
            onMessage(m) {
              if (m.type === 'peer-open') { peers.add(m.peer); return deliver({ kind: 'peer.open', payload: { peer: m.peer }, at: Date.now(), from: { channel: name, peer: m.peer }, live: true }); }
              if (m.type === 'peer-close') { peers.delete(m.peer); return deliver({ kind: 'peer.close', payload: { peer: m.peer, reason: 'closed' }, at: Date.now(), from: { channel: name, peer: m.peer }, live: true }); }
              if (m.type === 'data' && allowedFrame(m.data) && peers.has(m.peer)) return deliver({ kind: 'frame.' + m.data.t, payload: m.data, at: Date.now(), from: { channel: name, peer: m.peer }, live: true });
            } });
        },
        async stop() { status = 'stopped'; if (link) link.close(); link = null; peers.clear(); },
        send(env) {
          if (!link) return false;
          if (env.kind === 'peer.detach') { peers.delete(env.to); return link.send({ type: 'detach', peer: env.to }); }
          if (!env.kind.startsWith('frame.') || !env.to) return false;
          const frame = env.payload;
          if (!frame || typeof frame.t !== 'string') return false;
          return link.send({ type: 'data', peer: env.to, data: frame });
        },
      };
    }
    

terminal/setup-file!:
  this: id:terminal/setup-file/1.0.0/agent/runners/hub.mjs
  version: "1.0.0"
  path: "agent/runners/hub.mjs"
  sha256: "0fc57813ff3a27a03b8d6bee7acba7d2715afc994f1b45cd2311f7ad1b723131"
  content: |
    // Hub runner: terminal sessions, chat routing and the RTC answerer, exactly
    // as agent/hub.mjs provides them, plus the bridge between the bus and the
    // hub's socket door. Browser peers reach the hub as "frame.*" envelopes from
    // the relay channel; each peer gets one local socket to the hub, so the
    // hub's per-connection ownership rules are unchanged. Hub output frames go
    // back through the bus to the peer they belong to.
    
    import net from 'node:net';
    
    export const name = 'hub';
    export const required = true;
    export const routes = { relay: ['frame.*', 'peer.*'] };
    const MAX_BUFFER = 512 * 1024;
    
    // The bridge between relay peers on the bus and the hub's socket door. One
    // local socket per peer keeps the hub's attachment ownership per browser.
    export function createSocketBridge({ bus, socketPath, log = () => {}, channel = 'relay' }) {
      const peers = new Map();       // peer id -> socket
      const unsubscribes = [];
      const drop = (peer, detach = true) => {
        const sock = peers.get(peer); peers.delete(peer);
        if (sock) sock.destroy();
        if (detach) bus.send('peer.detach', {}, { via: channel, to: peer }).catch(() => {});
      };
      function open(peer) {
        drop(peer, false);
        const sock = net.createConnection(socketPath);
        peers.set(peer, sock);
        sock.setEncoding('utf8');
        let buffer = '';
        sock.on('data', chunk => {
          buffer += chunk;
          if (buffer.length > MAX_BUFFER) return drop(peer);
          let end;
          while ((end = buffer.indexOf('\n')) >= 0) {
            const line = buffer.slice(0, end); buffer = buffer.slice(end + 1);
            let frame; try { frame = JSON.parse(line); } catch { continue; }
            if (!frame || typeof frame.t !== 'string') continue;
            bus.send('frame.' + frame.t, frame, { via: channel, to: peer, live: true }).catch(() => {
              // Reconnect rather than silently corrupt an incomplete terminal stream.
              log('hub: relay output backpressure; detaching browser');
              drop(peer);
            });
          }
        });
        sock.on('error', () => drop(peer));
        sock.on('close', () => { if (peers.get(peer) === sock) drop(peer); });
      }
      return {
        start() {
          unsubscribes.push(
            bus.subscribe('peer.open', env => { if (env.from?.channel === channel) open(env.payload.peer); }),
            bus.subscribe('peer.close', env => { if (env.from?.channel === channel) drop(env.payload.peer, false); }),
            bus.subscribe('frame.*', env => {
              if (env.from?.channel !== channel) return;
              const sock = peers.get(env.from.peer);
              if (!sock || sock.writableLength > MAX_BUFFER) return drop(env.from.peer);
              sock.write(JSON.stringify(env.payload) + '\n');
            }));
        },
        stop() { for (const u of unsubscribes.splice(0)) u(); for (const peer of [...peers.keys()]) drop(peer, false); },
        peers: () => [...peers.keys()],
      };
    }
    
    export function create(ctx) {
      const { config, io, bus, root, log } = ctx;
      let hub = null, bridge = null;
      return {
        async start() {
          const { createHub } = await import('../hub.mjs');
          hub = createHub({ io, spot: config.space, ndc: null, terminal: true, terminalCwd: config.cwd || root, maxSessions: config.maxSessions || 8,
            agent: config.name || 'dashboard-host', createLanguageService: ctx.services.get('languageService') || undefined });
          await hub.start();
          ctx.provide('hubSocketPath', hub.socketPath);
          bridge = createSocketBridge({ bus, socketPath: hub.socketPath, log });
          bridge.start();
        },
        async stop() {
          if (bridge) bridge.stop(); bridge = null;
          if (hub) await hub.stop();
          hub = null;
        },
        health: () => ({ socket: hub ? hub.socketPath : null, peers: bridge ? bridge.peers().length : 0, connections: hub ? hub.conns.size : 0 }),
      };
    }
    

