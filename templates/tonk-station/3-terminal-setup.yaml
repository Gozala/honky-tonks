  this: id:terminal/setup-file/1.0.0/session/relay-client.mjs
  version: "1.0.0"
  path: "session/relay-client.mjs"
  sha256: "543c4331751726ea5d05a2ad1981093d66dea1890869abb36c51d68538565fbf"
  content: |
    // Shared Node/browser client. Commands are never replayed across disconnects.
    export function connectSession({ url, room, token, role, onMessage = () => {}, onStatus = () => {} }) {
      const parsed = new URL(url);
      if (parsed.protocol !== 'wss:' && !(parsed.protocol === 'ws:' && ['localhost', '127.0.0.1'].includes(parsed.hostname))) throw new Error('Relay URL must use WSS');
      let ws, stopped = false, retry, heartbeat, deadline, backoff = 500, authenticated = false;
      const closeTimers = () => { clearInterval(heartbeat); clearTimeout(deadline); };
      const send = m => {
        if (!authenticated || ws?.readyState !== 1 || ws.bufferedAmount > 512 * 1024) return false;
        const raw = JSON.stringify({ v: 1, ...m });
        if (new TextEncoder().encode(raw).length > 256 * 1024) return false;
        ws.send(raw); return true;
      };
      const dial = () => {
        if (stopped) return;
        authenticated = false; onStatus('connecting');
        const socket = ws = new WebSocket(url);
        // Every failure path ends in settle(), once per socket. Node (undici) emits no 'close' after a failed
        // handshake or for a dead peer, and close() on a CONNECTING socket re-fires 'error' synchronously, so
        // neither "wait for onclose" nor "close() from onerror" is safe there.
        let settled = false;
        const settle = (code = 1006, reason = '') => {
          if (settled) return;
          settled = true;
          try { socket.close(); } catch {}
          if (ws !== socket) return;
          authenticated = false; closeTimers();
          const fatal = [4001, 1008, 1009].includes(code);
          onStatus(fatal ? 'authentication-or-protocol-error' : 'disconnected', { code, reason });
          if (!stopped && !fatal) {
            retry = setTimeout(dial, backoff * (0.75 + Math.random() * 0.5));
            backoff = Math.min(15000, backoff * 2);
          }
        };
        deadline = setTimeout(() => settle(1006, 'connect timeout'), 10000);
        socket.onopen = () => socket.send(JSON.stringify({ v: 1, type: 'auth', role, room, token }));
        socket.onmessage = event => {
          if (ws !== socket) return;
          let m; try { m = JSON.parse(String(event.data)); } catch { return; }
          if (m.v !== 1) return;
          if (m.type === 'ready') {
            authenticated = true; backoff = 500; clearTimeout(deadline);
            onStatus('connected');
            heartbeat = setInterval(() => {
              if (!send({ type: 'ping' })) return settle(1006, 'ping not sent');
              deadline = setTimeout(() => settle(1006, 'pong timeout'), 10000);
            }, 15000);
          }
          if (m.type === 'pong') { clearTimeout(deadline); return; }
          onMessage(m);
        };
        socket.onerror = () => settle(1006, 'socket error');
        socket.onclose = event => settle(event.code, event.reason);
      };
      dial();
      return { send, close() { stopped = true; token = ''; clearTimeout(retry); closeTimers(); authenticated = false; ws?.close(); } };
    }
    

terminal/setup-file!:
  this: id:terminal/setup-file/1.0.0/worker/relay.ts
  version: "1.0.0"
  path: "worker/relay.ts"
  sha256: "21c5f430e28b9f4f639a1ae886a545aadb79f8214bdf6cb50a94d12aced6cf54"
  content: |
    import { DurableObject } from 'cloudflare:workers';
    
    export interface Env {
      SESSIONS: DurableObjectNamespace<SessionRoom>;
      SESSION_ROOM: string;
      BROWSER_TOKEN: string;
      HOST_TOKEN: string;
      UPGRADE_LIMITER: RateLimit;
    }
    type Role = 'browser' | 'host';
    type Attachment = { id: string; role?: Role; deadline: number; closed?: boolean; window: number; bytes: number; frames: number };
    const MAX_FRAME = 256 * 1024;
    const encoder = new TextEncoder();
    const equal = (a: unknown, b: string) => {
      if (typeof a !== 'string' || !b) return false;
      const x = encoder.encode(a), y = encoder.encode(b);
      return x.length === y.length && crypto.subtle.timingSafeEqual(x, y);
    };
    const object = (v: unknown): v is Record<string, any> => !!v && typeof v === 'object' && !Array.isArray(v);
    const allowed = new Set(['ping','pong','conv-open','conv-close','say','stop','permission-response','chat-model','session-rename','term-open','term-in','term-resize','term-close','term-kill','language-submit','language-cancel']);
    export const browserFrame = (v: unknown) => object(v) && !('c' in v) && allowed.has(v.t);
    
    export default {
      async fetch(request, env): Promise<Response> {
        const url = new URL(request.url);
        if (url.pathname === '/health') return Response.json({ service: 'agent-session-relay', version: 1 });
        if (url.pathname !== '/ws') return new Response('Not found', { status: 404 });
        if (request.headers.get('Upgrade')?.toLowerCase() !== 'websocket') return new Response('WebSocket required', { status: 426 });
        if (!env.BROWSER_TOKEN || !env.HOST_TOKEN || !env.SESSION_ROOM) return new Response('Not configured', { status: 503 });
        const limit = await env.UPGRADE_LIMITER.limit({ key: request.headers.get('CF-Connecting-IP') || 'unknown' });
        if (!limit.success) return new Response('Rate limited', { status: 429 });
        return env.SESSIONS.getByName(env.SESSION_ROOM).fetch(request);
      },
    } satisfies ExportedHandler<Env>;
    
    // Like the creative-intelligence relay, this keeps socket state in hibernation
    // attachments. No terminal bytes, chat history or credentials are persisted.
    export class SessionRoom extends DurableObject<Env> {
      peers() {
        return this.ctx.getWebSockets().map(ws => ({ ws, a: ws.deserializeAttachment() as Attachment })).filter(p => p.a && !p.a.closed);
      }
      send(ws: WebSocket, m: unknown) { try { ws.send(JSON.stringify(m)); } catch { this.close(ws, 1011, 'Send failed'); } }
      close(ws: WebSocket, code: number, reason: string) {
        const a = ws.deserializeAttachment() as Attachment;
        if (!a || a.closed) return;
        a.closed = true; ws.serializeAttachment(a);
        // Deferred peer closes avoid the workerd inline callback destruction bug.
        setTimeout(() => { try { ws.close(code, reason); } catch {} }, 0);
        this.depart(a);
      }
      depart(a: Attachment) {
        if (a.role === 'host') {
          for (const p of this.peers().filter(p => p.a.role === 'browser')) this.send(p.ws, { v: 1, type: 'host-status', online: false });
        } else if (a.role === 'browser') {
          const h = this.peers().find(p => p.a.role === 'host');
          if (h) this.send(h.ws, { v: 1, type: 'peer-close', peer: a.id });
        }
      }
      async schedule() {
        const deadlines = this.peers().map(p => p.a.deadline);
        if (deadlines.length) await this.ctx.storage.setAlarm(Math.min(...deadlines));
        else await this.ctx.storage.deleteAlarm();
      }
      async alarm() {
        for (const p of this.peers()) if (p.a.deadline <= Date.now()) this.close(p.ws, 4004, 'Lease expired');
        await this.schedule();
      }
      async fetch(): Promise<Response> {
        await this.alarm();
        if (this.peers().length >= 24) return new Response('Room full', { status: 503 });
        const pair = new WebSocketPair();
        this.ctx.acceptWebSocket(pair[1]);
        const a: Attachment = { id: crypto.randomUUID(), deadline: Date.now() + 5000, window: Date.now(), bytes: 0, frames: 0 };
        pair[1].serializeAttachment(a);
        await this.schedule();
        return new Response(null, { status: 101, webSocket: pair[0] });
      }
      async webSocketMessage(ws: WebSocket, raw: string | ArrayBuffer) {
        const a = ws.deserializeAttachment() as Attachment;
        if (a.closed) return;
        if (a.deadline <= Date.now()) return this.close(ws, 4004, 'Lease expired');
        if (typeof raw !== 'string' || encoder.encode(raw).length > MAX_FRAME) return this.close(ws, 1009, 'Frame too large');
        const now = Date.now();
        if (now - a.window >= 1000) { a.window = now; a.frames = 0; a.bytes = 0; }
        a.frames++; a.bytes += encoder.encode(raw).length;
        if (a.frames > 512 || a.bytes > 4 * 1024 * 1024) return this.close(ws, 1013, 'Rate limited; retry');
        let m: any;
        try { m = JSON.parse(raw); } catch { return this.close(ws, 1008, 'Invalid JSON'); }
        if (!object(m) || m.v !== 1) return this.close(ws, 1008, 'Invalid protocol');
        if (!a.role) {
          const token = m.role === 'host' ? this.env.HOST_TOKEN : m.role === 'browser' ? this.env.BROWSER_TOKEN : '';
          if (m.type !== 'auth' || m.room !== this.env.SESSION_ROOM || !equal(m.token, token)) return this.close(ws, 4001, 'Unauthorized');
          if (m.role === 'host' && this.peers().some(p => p.a.role === 'host')) return this.close(ws, 4002, 'Host already connected');
          if (m.role === 'browser' && this.peers().filter(p => p.a.role === 'browser').length >= 16) return this.close(ws, 4002, 'Room full');
          a.role = m.role; a.deadline = now + 45000; ws.serializeAttachment(a);
          const host = this.peers().find(p => p.a.role === 'host');
          this.send(ws, { v: 1, type: 'ready', peer: a.id, online: !!host });
          if (a.role === 'host') {
            for (const p of this.peers().filter(p => p.a.role === 'browser')) {
              this.send(p.ws, { v: 1, type: 'host-status', online: true });
              this.send(ws, { v: 1, type: 'peer-open', peer: p.a.id });
            }
          } else if (host) this.send(host.ws, { v: 1, type: 'peer-open', peer: a.id });
          await this.schedule();
          return;
        }
        a.deadline = now + 45000; ws.serializeAttachment(a);
        if (m.type === 'ping') { this.send(ws, { v: 1, type: 'pong' }); return; }
        if (a.role === 'host' && m.type === 'detach') {
          const p = this.peers().find(p => p.a.role === 'browser' && p.a.id === m.peer);
          if (p) this.close(p.ws, 1012, 'Host connection reset');
          return;
        }
        if (m.type !== 'data' || !object(m.data)) return this.close(ws, 1008, 'Invalid message');
        if (a.role === 'browser') {
          if (!browserFrame(m.data)) return this.close(ws, 1008, 'Unsupported client frame');
          const h = this.peers().find(p => p.a.role === 'host');
          if (!h) { this.send(ws, { v: 1, type: 'host-status', online: false }); return; }
          this.send(h.ws, { v: 1, type: 'data', peer: a.id, data: m.data });
        } else {
          const p = this.peers().find(p => p.a.role === 'browser' && p.a.id === m.peer);
          if (p) this.send(p.ws, { v: 1, type: 'data', data: m.data });
        }
      }
      async webSocketClose(ws: WebSocket) {
        const a = ws.deserializeAttachment() as Attachment;
        if (a && !a.closed) { a.closed = true; ws.serializeAttachment(a); this.depart(a); }
        try { ws.close(); } catch {}
        await this.schedule();
      }
      async webSocketError(ws: WebSocket) { this.close(ws, 1011, 'Socket error'); await this.schedule(); }
    }
    
