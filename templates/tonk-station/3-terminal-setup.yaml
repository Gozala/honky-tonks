# ---- 05-terminal-setup-package.yaml ----
# Credential-free terminal installer. Read terminal/setup with the Tonk CLI.
terminal/setup!:
  this: id:terminal/setup
  version: "1.0.0"
  instructions: |
    # Terminal connection setup — version 1.0.0
    
    This package belongs to the terminal artifact. It contains its local host, Cloudflare Worker, and agent operations. Use the existing Tonk CLI; do not change Tonk or require another dashboard checkout. Supported hosts: macOS or Linux with Node 22+, npm, tmux 3.2+, and a connected Tonk CLI. On Windows use a Linux/WSL host. This package provides terminal sessions, not a chat or task executor.
    
    ## Find and extract the package from a space
    
    Run commands from the user's connected workspace. First run `tonk status` and confirm the intended space. If this workspace uses an existing `.tonk-state` directory, set `TONK_SPACES_STATE` to that directory's absolute path for every CLI call. Preserve other bindings. If not connected, use the user's normal invitation flow and wait for `Agent connection confirmed`; do not invent an invite or reuse another space's authority.
    
    The entry record is `id:terminal/setup`, queried with `tonk query terminal/setup --json`. Read its `instructions` field (this guide). All source files are `terminal/setup-file` rows, tied to the setup version. No credentials are included in these rows.
    
    1. Save `tonk query terminal/setup --json` to `terminal-setup.json` and `tonk query terminal/setup-file --json` to `terminal-setup-files.json` in a local preparation directory. Use the connected space alias explicitly if needed.
    2. Read the setup's `extractor` field. It is the included `extract.mjs` source. Save it locally, inspect it, then run it with the two query results:
    
    ```sh
    node -e 'const fs=require("node:fs");const rows=JSON.parse(fs.readFileSync("terminal-setup.json","utf8"));fs.writeFileSync("extract-terminal.mjs",rows.find(r=>r.this==="id:terminal/setup").extractor,{flag:"wx"})'
    node -e 'const fs=require("node:fs");process.stdout.write(JSON.stringify({setup:JSON.parse(fs.readFileSync("terminal-setup.json","utf8")),files:JSON.parse(fs.readFileSync("terminal-setup-files.json","utf8"))}))' | node extract-terminal.mjs ./terminal-connection
    ```
    
    The extractor requires a fresh destination, checks every path and SHA-256 against the manifest, and refuses mismatches before writing. Hashes verify consistency with the space, not independent code provenance. Review the extracted source before executing it. All following commands run from `terminal-connection/` unless stated otherwise.
    
    ## Agent operation: set up
    
    1. Inspect the current connection before changing it. Query `deck/setting` with the CLI and report only whether relay URL/room/token are present; never print tokens. If an existing connection is healthy, reuse it. If this is a clone, create a fresh installation rather than inheriting access to its source computer. A YAML export can include old connection settings: their presence does not prove ownership or freshness.
    2. Check `node --version`, `npm --version`, `tmux -V`, and `tonk status`. Resolve missing dependencies with the user's platform package manager. `npm install` in this package installs pinned node-pty 1.1.0 and Wrangler 4.130.0. Native node-pty may require platform build tools. Do not load Claude, another agent, or a neighboring repository.
    3. Initialise local configuration, supplying actual verified values (the placeholders below must be replaced):
    
    ```sh
    node setup.mjs init --cwd /absolute/workspace --space LOCAL_SPACE_ALIAS --tonk /absolute/path/to/tonk
    ```
    
    If the workspace uses an isolated state directory, also pass `--state-dir /absolute/workspace/.tonk-state`. The default Worker name and room are unique. Optional `--worker-name` selects a NEW Worker name; do not overwrite another deployment. Init validates `sync: synced`, refuses existing configuration, and creates `.private/host.json`, `.private/browser.json`, and `worker/wrangler.jsonc`. Private files are mode 0600 inside a mode-0700 directory. Never commit or publish `.private/`, never put the host token in Tonk, and never include credentials in a response.
    
    4. Explain the access being set up: members holding this space's browser credential can execute shell commands as this machine's user; the working directory is not a sandbox. Use the Cloudflare account the user intends. Inspect `npx wrangler whoami`; if login is needed run `npx wrangler login` and let the user complete authentication. Do not switch accounts silently. New cloud resources or charges should be handled under the user's existing authorization and your applicable approval policy.
    5. Deploy the provided Worker and install its secrets:
    
    ```sh
    npx wrangler deploy --config worker/wrangler.jsonc
    node setup.mjs secrets
    ```
    
    The Worker has one Durable Object room and separate host/browser credentials. It rejects connections until secrets are configured. `secrets` supplies both keys to the configured Worker's `wrangler secret bulk` over stdin, never command arguments or console output. Record the URL actually returned by deploy; do not guess the account subdomain. Store it with:
    
    ```sh
    node setup.mjs url https://ACTUAL_WORKER_HOST.workers.dev
    ```
    
    6. Publish the three browser settings atomically through Tonk, then verify their values and `sync: synced`:
    
    ```sh
    node setup.mjs publish
    ```
    
    Existing differing credentials cause a stop. Use `node setup.mjs publish --replace` only when an intentional replacement or fresh clone is established. Stop any host for the target installation before changing its settings so its CLI queue does not compete. Preserve the former private configuration for recovery. Never replace a working connection just because the terminal UI was reloaded.
    7. Start the local host with `node start.mjs`. Keep it running in a terminal or a background process with a private log and recorded PID. Do not assume a detached process survives reboot; install a launch/login service only when requested. On a second terminal run `node verify.mjs`. It authenticates through the relay, opens a uniquely named temporary shell, prints a marker and `pwd`, verifies the actual output and working directory, and kills only that temporary shell. Open/reload the dashboard terminal and verify it attaches. Host startup alone is not end-to-end success.
    8. Report the verified result, local package directory, start/stop commands, and any unverified browser or network step. Keep all secrets out of the response.
    
    ## Agent operation: diagnose
    
    Start with `node setup.mjs doctor`. It checks Node, tmux, node-pty, the bound space and sync, presence of the three relay settings, and the Worker's health endpoint without printing tokens. A health HTTP 200 does not prove authentication. With the host running, use `node verify.mjs` to test the real path.
    
    - Missing settings: follow setup. If this was a clone, provision fresh credentials.
    - Relay authentication rejected: compare the room and browser credential locally against this installation, and verify the Worker secrets. Do not print them or transmit them to any other endpoint.
    - Relay connected but no host: start this package's `start.mjs` on the intended machine; check its log.
    - Host already connected: identify the existing owner before stopping or replacing anything. The Worker allows only one host per room.
    - Host connected but no shell: inspect tmux/node-pty errors and filesystem permissions; verify the configured cwd exists. The host requires tmux >=3.2.
    - Tonk lock errors: avoid parallel CLI calls; stop the relevant local host briefly before direct maintenance, or use its local serialized admin socket. Preserve tmux sessions.
    - Blank screen with a passing shell test: reload the terminal/page. Do not rotate working credentials to fix a rendering issue.
    
    ## Agent operation: disconnect
    
    For a temporary disconnect, Ctrl-C the foreground host or send SIGTERM to its verified PID. This stops relay access while preserving its tmux sessions. Confirm the host is offline; do not kill unrelated Node or tmux processes.
    
    For permanent revocation, stop this host first, then remove/rotate BOTH Worker secrets (HOST_TOKEN and BROWSER_TOKEN) and clear only this connection's three `deck/setting` values through `deck/update-setting` after querying their entity IDs. Verify sync. Clearing space settings alone does not revoke a copied key, and updating Worker secrets alone may leave existing sockets alive until their lease expires (up to 45 seconds). Confirm old credentials can no longer connect. Delete the Worker only when the user requests removal of the cloud resource. Preserve or explicitly remove local shell sessions according to the user's request.
    
    ## Distributing YAML or cloning a space
    
    Include the terminal/setup and terminal/setup-file schemas and records plus the terminal custom elements. Strip session-relay-url, session-relay-room and session-relay-token VALUES from reusable template exports. The embedded package itself is credential-free. Tonk cloning does not provide this package with a clone event, so it cannot automatically invalidate inherited credentials; for a full state clone the setup agent must establish ownership and use fresh pairing. The terminal shows setup instructions when any connection setting is absent, and diagnostic instructions when configured but disconnected.
    
    ## References
    
    - https://developers.cloudflare.com/workers/wrangler/commands/workers/ (deploy and secret bulk)
    - https://developers.cloudflare.com/workers/wrangler/commands/general/ (login and whoami)
    - https://developers.cloudflare.com/workers/wrangler/configuration/ (Worker and Durable Object configuration)
    
    The Worker source uses the existing, compatible SQLite Durable Object migration declaration and Wrangler 4.130.0. No deployment is performed just by importing this YAML.
    
  manifest: "[{\"path\":\"package.json\",\"sha256\":\"3c14b508f099d06c8e555a77d7065f25c476019dff69e4768bfd03341fd8843b\",\"bytes\":329},{\"path\":\".gitignore\",\"sha256\":\"ffe1a40c8cf18927c8c56de9e5957211892badf6672a8a0b41ce4949ea26ae3a\",\"bytes\":64},{\"path\":\"AGENT-SETUP.md\",\"sha256\":\"87a18616c6a5c7d8327ddc1bff31f4a8403efa9965cb9a6fbd82ce98d7f5fd10\",\"bytes\":9642},{\"path\":\"config.mjs\",\"sha256\":\"f9f6e907187c3f568aaaa3aec5769e25b50587256c81b1b3c8409f7e0dc61e78\",\"bytes\":1262},{\"path\":\"start.mjs\",\"sha256\":\"5be8cc887f72cdaf3b9221e0e48df9e044dea703783b1d57fc2f7aa7c392d0cf\",\"bytes\":1974},{\"path\":\"setup.mjs\",\"sha256\":\"753a4197f1de7d3386dd9f2392aaa7b32ce00dd4a540b2d3676836398c6c1097\",\"bytes\":5735},{\"path\":\"verify.mjs\",\"sha256\":\"1b173af5f5189a6d3865a95addf7f5c9c5a8a4c5995870acb6a593e80c5b0545\",\"bytes\":1853},{\"path\":\"extract.mjs\",\"sha256\":\"f52838858302caf187747452a061037f62aef93ba31649188500fbd3c18014d7\",\"bytes\":1672},{\"path\":\"agent/hub.mjs\",\"sha256\":\"c3286cf926908579f507ba3d6a219bc705d07927aa3d4488c8468d1c16303b69\",\"bytes\":82130},{\"path\":\"agent/pty-host.mjs\",\"sha256\":\"7c66b88dee7947d1fab83592187a9b6914e4f048b9df595c12108163479a44d4\",\"bytes\":12543},{\"path\":\"agent/terminal-config.mjs\",\"sha256\":\"fa61b65c595e4fb1ce4447b5e319c61624c453492fb9926bf5ef4df2fd88cc6b\",\"bytes\":2579},{\"path\":\"agent/terminal-title.mjs\",\"sha256\":\"e7d93b21b103b5268830c91dc7dd85a4c8efd18694682ebc8c3389de561f9dda\",\"bytes\":665},{\"path\":\"agent/bus.mjs\",\"sha256\":\"92c2c60b0d390da79d5afa6415412c0ed86204a412e9bf2a02e946440e2aa685\",\"bytes\":7187},{\"path\":\"agent/relay-bridge.mjs\",\"sha256\":\"ff1f82c4d777276b586bb5ca8a8f02a3f7d74a242ec47ff9d2155994215909fd\",\"bytes\":966},{\"path\":\"agent/channels/relay.mjs\",\"sha256\":\"1c3bf6cd1faf6975cbe6ca34ee26623ec8aa6cd7975abf2496ec94d0ad70d5ec\",\"bytes\":2952},{\"path\":\"agent/runners/hub.mjs\",\"sha256\":\"0fc57813ff3a27a03b8d6bee7acba7d2715afc994f1b45cd2311f7ad1b723131\",\"bytes\":3795},{\"path\":\"session/relay-client.mjs\",\"sha256\":\"543c4331751726ea5d05a2ad1981093d66dea1890869abb36c51d68538565fbf\",\"bytes\":2879},{\"path\":\"worker/relay.ts\",\"sha256\":\"21c5f430e28b9f4f639a1ae886a545aadb79f8214bdf6cb50a94d12aced6cf54\",\"bytes\":7295}]"
  extractor: |
    // Read a JSON object with {setup: <terminal/setup rows>, files: <terminal/setup-file rows>}.
    // Validates every entry before creating a fresh directory. Never overwrites a checkout.
    import {readFileSync,mkdirSync,writeFileSync,existsSync} from 'node:fs';
    import {resolve,dirname} from 'node:path';
    import {createHash} from 'node:crypto';
    const input=JSON.parse(readFileSync(0,'utf8'));
    const setup=input.setup.find(r=>r.this==='id:terminal/setup');
    if(!setup)throw Error('Missing id:terminal/setup');
    const manifest=JSON.parse(setup.manifest),expected=new Map(manifest.map(f=>[f.path,f]));
    const rows=input.files.filter(f=>f.version===setup.version);
    if(rows.length!==expected.size)throw Error('File count mismatch');
    const seen=new Set();
    for(const f of rows){
     if(!/^[a-zA-Z0-9_.\/-]+$/.test(f.path)||f.path.startsWith('/')||f.path.split('/').some(p=>!p||p==='.'||p==='..')||seen.has(f.path))throw Error('Unsafe or duplicate path');
     const want=expected.get(f.path),hash=createHash('sha256').update(f.content).digest('hex');
     if(!want||hash!==want.sha256||hash!==f.sha256||Buffer.byteLength(f.content)!==want.bytes)throw Error('Integrity mismatch: '+f.path);
     seen.add(f.path);
    }
    if(!process.argv[2])throw Error('Pass a fresh destination directory');
    const dest=resolve(process.argv[2]);if(existsSync(dest))throw Error('Destination already exists; choose a fresh directory');
    mkdirSync(dest,{mode:0o700});
    for(const f of rows){const path=resolve(dest,f.path);mkdirSync(dirname(path),{recursive:true,mode:0o700});writeFileSync(path,f.content,{flag:'wx',mode:0o600})}
    console.log('Extracted terminal setup '+setup.version+' ('+rows.length+' verified files) into '+dest);
    

