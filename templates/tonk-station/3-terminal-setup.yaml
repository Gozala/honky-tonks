terminal/setup-file!:
  this: id:terminal/setup-file/1.0.0/config.mjs
  version: "1.0.0"
  path: "config.mjs"
  sha256: "f9f6e907187c3f568aaaa3aec5769e25b50587256c81b1b3c8409f7e0dc61e78"
  content: |
    import {readFileSync} from 'node:fs';
    import {fileURLToPath} from 'node:url';
    import {resolve,dirname} from 'node:path';
    import {execFileSync} from 'node:child_process';
    export const root=dirname(fileURLToPath(import.meta.url));
    export const configPath=resolve(root,'.private/host.json');
    export const load=()=>JSON.parse(readFileSync(configPath,'utf8'));
    export function environment(c){
     const env={...process.env,TONK_SPACE:c.space};
     delete env.TONK_NO_SYNC;
     if(c.stateDir)env.TONK_SPACES_STATE=c.stateDir;else delete env.TONK_SPACES_STATE;
     return env;
    }
    export function tonk(c,args,options={}){
     return execFileSync(c.tonk||'tonk',['--space',c.space,...args],{cwd:c.cwd,env:environment(c),encoding:'utf8',timeout:90000,maxBuffer:16*1024*1024,...options});
    }
    export function endpoint(value){
     const u=new URL(value);
     if(u.username||u.password||u.search||u.hash)throw Error('Relay URL cannot include credentials, a query, or fragment');
     if(u.protocol==='https:')u.protocol='wss:';
     if(u.protocol!=='wss:'&&!(u.protocol==='ws:'&&['localhost','127.0.0.1'].includes(u.hostname)))throw Error('Use a WSS relay URL');
     if(u.pathname==='/'||u.pathname==='')u.pathname='/ws';
     if(u.pathname!=='/ws')throw Error('Relay endpoint must end in /ws');
     return u.href;
    }
    

terminal/setup-file!:
  this: id:terminal/setup-file/1.0.0/start.mjs
  version: "1.0.0"
  path: "start.mjs"
  sha256: "5be8cc887f72cdaf3b9221e0e48df9e044dea703783b1d57fc2f7aa7c392d0cf"
  content: |
    import {execFile} from 'node:child_process';
    import {promisify} from 'node:util';
    import {hostname,tmpdir} from 'node:os';
    import {createHash} from 'node:crypto';
    import {join} from 'node:path';
    import {load,environment,endpoint} from './config.mjs';
    import {createHub,createBranchIO} from './agent/hub.mjs';
    import {startRelayBridge} from './agent/relay-bridge.mjs';
    if(Number(process.versions.node.split('.')[0])<22)throw Error('Node 22 or newer is required');
    const c=load();c.url=endpoint(c.url);
    if(!c.token||!c.room||!c.space||!c.cwd)throw Error('Run setup.mjs init and setup.mjs url first');
    const env=environment(c);Object.assign(process.env,env);if(!c.stateDir)delete process.env.TONK_SPACES_STATE;
    delete process.env.TONK_NO_SYNC;
    process.chdir(c.cwd);
    const log=m=>console.log(`[${new Date().toISOString()}] ${m}`),run=promisify(execFile);
    const io=createBranchIO({spot:c.space,syncGapMs:4000,log,runCommand:async(args,{timeoutMs=60000}={})=>(await run(c.tonk||'tonk',['--space',c.space,...args],{cwd:c.cwd,env,timeout:timeoutMs,maxBuffer:16*1024*1024})).stdout});
    // Room identity, rather than a reusable local space alias, isolates cloned installs.
    const key=createHash('sha256').update(c.url+'\n'+c.room).digest('hex').slice(0,20);
    const hub=createHub({io,spot:c.space,ndc:null,terminal:true,terminalCwd:c.cwd,maxSessions:8,agent:hostname(),ns:'tonk-terminal-'+key,socketPath:join(tmpdir(),'tonk-terminal-'+key+'.sock'),log});
    let bridge,stopping=false,started=false;
    async function stop(){if(stopping)return;stopping=true;bridge?.close();if(started)await hub.stop();await io.stop();}
    try{await io.start();await hub.start();started=true;bridge=startRelayBridge({url:c.url,room:c.room,token:c.token,socketPath:hub.socketPath,log});log('Terminal host started. Ctrl-C disconnects it; tmux sessions are retained.');}
    catch(e){await stop().catch(()=>{});throw e;}
    for(const signal of ['SIGINT','SIGTERM'])process.on(signal,async()=>{await stop();process.exit(0)});
    

terminal/setup-file!:
  this: id:terminal/setup-file/1.0.0/setup.mjs
  version: "1.0.0"
  path: "setup.mjs"
  sha256: "753a4197f1de7d3386dd9f2392aaa7b32ce00dd4a540b2d3676836398c6c1097"
  content: |
    import {mkdirSync,writeFileSync,readFileSync,existsSync,chmodSync} from 'node:fs';
    import {resolve,isAbsolute} from 'node:path';
    import {randomBytes} from 'node:crypto';
    import {execFileSync} from 'node:child_process';
    import {root,configPath,load,tonk,endpoint} from './config.mjs';
    const [command,...args]=process.argv.slice(2);
    const option=(name,fallback='')=>{const i=args.indexOf('--'+name);return i<0?fallback:args[i+1]||''};
    const save=(path,value)=>{writeFileSync(path,JSON.stringify(value,null,2)+'\n',{mode:0o600});chmodSync(path,0o600)};
    function synced(c){const status=tonk(c,['status']);if(!/^sync: synced\s*$/m.test(status))throw Error('Space has not confirmed sync: synced');return status;}
    async function main(){
     if(command==='init'){
      if(existsSync(configPath)||existsSync(resolve(root,'worker/wrangler.jsonc')))throw Error('Setup already exists. Preserve its credentials; diagnose it or extract a fresh directory for a new space.');
      const cwd=option('cwd'),space=option('space'),binary=option('tonk','tonk'),stateDir=option('state-dir');
      if(!cwd||!isAbsolute(cwd)||!existsSync(cwd)||!space||space.startsWith('-'))throw Error('Provide --cwd /absolute/workspace and --space <verified CLI alias>');
      if(stateDir&&(!isAbsolute(stateDir)||!existsSync(stateDir)))throw Error('--state-dir must be an existing absolute Tonk state directory');
      const worker=option('worker-name','tonk-terminal-'+randomBytes(6).toString('hex'));
      if(!/^[a-z][a-z0-9-]{2,55}$/.test(worker))throw Error('Worker name must be 3–56 lowercase letters, digits or hyphens');
      const c={version:1,url:'',room:'terminal-'+randomBytes(16).toString('hex'),token:randomBytes(32).toString('base64url'),space,cwd,tonk:binary,stateDir};
      // Validate the CLI binding before generating durable local configuration.
      process.stdout.write(synced(c));
      mkdirSync(resolve(root,'.private'),{recursive:true,mode:0o700});chmodSync(resolve(root,'.private'),0o700);
      save(configPath,c);save(resolve(root,'.private/browser.json'),{token:randomBytes(32).toString('base64url')});
      save(resolve(root,'worker/wrangler.jsonc'),{name:worker,main:'relay.ts',compatibility_date:'2026-09-01',workers_dev:true,vars:{SESSION_ROOM:c.room},durable_objects:{bindings:[{name:'SESSIONS',class_name:'SessionRoom'}]},migrations:[{tag:'v1',new_sqlite_classes:['SessionRoom']}],ratelimits:[{name:'UPGRADE_LIMITER',namespace_id:'88042',simple:{limit:60,period:60}}]});
      console.log('Prepared '+worker+'. Private credentials saved locally; nothing deployed or published.');return;
     }
     const c=load();
     if(command==='url'){c.url=endpoint(args[0]);save(configPath,c);console.log('Saved relay endpoint '+c.url);return;}
     if(command==='secrets'){
      const browser=JSON.parse(readFileSync(resolve(root,'.private/browser.json'),'utf8'));
      execFileSync(process.execPath,[resolve(root,'node_modules/wrangler/bin/wrangler.js'),'secret','bulk'],{cwd:resolve(root,'worker'),input:JSON.stringify({HOST_TOKEN:c.token,BROWSER_TOKEN:browser.token}),stdio:['pipe','inherit','inherit']});return;
     }
     if(command==='publish'){
      c.url=endpoint(c.url);const token=JSON.parse(readFileSync(resolve(root,'.private/browser.json'),'utf8')).token;
      const values={'session-relay-url':c.url,'session-relay-room':c.room,'session-relay-token':token};
      const rows=JSON.parse(tonk(c,['query','deck/setting','--json']));
      const changes=[];
      for(const [name,value]of Object.entries(values)){
       const found=rows.filter(r=>r.name===name);
       if(found.length>1)throw Error('Duplicate '+name+' settings; reconcile these through the Tonk CLI first');
       if(found[0]?.value===value)continue;
       if(found[0]?.value&&!args.includes('--replace'))throw Error('Existing terminal connection found. Diagnose first; --replace is only for an intentional replacement or clone.');
       changes.push(found.length?'deck/update-setting!:\n  setting: '+JSON.stringify(found[0].this)+'\n  value: '+JSON.stringify(value):'deck/create-setting!:\n  name: '+JSON.stringify(name)+'\n  value: '+JSON.stringify(value)+'\n  time: '+Date.now());
      }
      if(changes.length)tonk(c,['eval','-','-q'],{input:changes.join('\n\n')});
      const actual=JSON.parse(tonk(c,['query','deck/setting','--json']));
      for(const [name,value]of Object.entries(values))if(actual.filter(r=>r.name===name&&r.value===value).length!==1)throw Error('Setting verification failed: '+name);
      synced(c);console.log('Relay settings verified; sync: synced. Host credential remains local.');return;
     }
     if(command==='doctor'){
      console.log('Node '+process.versions.node+'; workspace '+c.cwd+'; space '+c.space);
      if(Number(process.versions.node.split('.')[0])<22)throw Error('Node 22+ required');
      const tmux=existsSync('/opt/homebrew/bin/tmux')?'/opt/homebrew/bin/tmux':'tmux';console.log(execFileSync(tmux,['-V'],{encoding:'utf8'}).trim());
      await import('node-pty');console.log('node-pty loads');process.stdout.write(synced(c));
      const rows=JSON.parse(tonk(c,['query','deck/setting','--json']));
      console.log('Space relay fields: '+['url','room','token'].map(k=>k+'='+(rows.some(r=>r.name==='session-relay-'+k&&r.value)?'present':'missing')).join(', '));
      if(c.url){const u=new URL(endpoint(c.url));u.protocol=u.protocol==='wss:'?'https:':'http:';u.pathname='/health';const r=await fetch(u,{signal:AbortSignal.timeout(10000)});console.log('Relay health HTTP '+r.status);if(!r.ok)process.exitCode=1;}
      console.log('Run node verify.mjs with the host running to check authentication and actual shell I/O.');return;
     }
     throw Error('Commands: init --cwd /workspace --space alias [--state-dir /path] [--tonk /binary] [--worker-name name], url <wss-endpoint>, secrets, publish [--replace], doctor');
    }
    main().catch(e=>{console.error(e.message);process.exitCode=1});
    

terminal/setup-file!:
  this: id:terminal/setup-file/1.0.0/verify.mjs
  version: "1.0.0"
  path: "verify.mjs"
  sha256: "1b173af5f5189a6d3865a95addf7f5c9c5a8a4c5995870acb6a593e80c5b0545"
  content: |
    import {readFileSync} from 'node:fs';
    import {resolve} from 'node:path';
    import {randomBytes} from 'node:crypto';
    import {load,root,endpoint} from './config.mjs';
    import {connectSession} from './session/relay-client.mjs';
    const c=load(),token=JSON.parse(readFileSync(resolve(root,'.private/browser.json'),'utf8')).token;
    const session='setup-check-'+randomBytes(8).toString('hex');let output='',status='',hello=false,opened=false,exited=false;
    const link=connectSession({url:endpoint(c.url),room:c.room,token,role:'browser',onStatus:s=>{status=s},onMessage:m=>{const f=m.data;if(m.type!=='data')return;if(f.t==='hello')hello=true;if(f.session!==session)return;if(f.t==='term-out')output+=Buffer.from(f.d,'base64').toString('utf8');if(f.t==='term-exit')exited=true;if(f.t==='term-deny')status='denied: '+(f.reason||'terminal unavailable')}});
    const send=data=>{if(!link.send({type:'data',data}))throw Error('Relay unavailable: '+status)};
    const wait=async(fn,label)=>{const deadline=Date.now()+20000;while(!fn()){if(Date.now()>deadline)throw Error(label+' timed out ('+status+')');await new Promise(r=>setTimeout(r,50))}};
    try{
     await wait(()=>hello,'Host greeting');send({t:'term-open',session,cols:100,rows:24});opened=true;
     await wait(()=>output.length>0,'Shell output');
     send({t:'term-in',session,d:Buffer.from("printf '\\nTONK_%s\\n' 'SETUP_OK'; pwd\n").toString('base64')});
     await wait(()=>output.includes('TONK_SETUP_OK')&&output.includes(c.cwd),'Shell command and working directory');
     send({t:'term-kill',session});await wait(()=>exited,'Temporary shell cleanup');opened=false;
     console.log('PASS: relay authentication, host greeting, shell input/output, working directory, temporary shell cleanup.');
    }catch(e){console.error(e.message);process.exitCode=1}finally{if(opened)link.send({type:'data',data:{t:'term-kill',session}});link.close()}
    

terminal/setup-file!:
  this: id:terminal/setup-file/1.0.0/extract.mjs
  version: "1.0.0"
  path: "extract.mjs"
  sha256: "f52838858302caf187747452a061037f62aef93ba31649188500fbd3c18014d7"
  content: |
    // Read a JSON object with {setup: <terminal/setup rows>, files: <terminal/setup-file rows>}.
    // Validates every entry before creating a fresh directory. Never overwrites a checkout.
    import {readFileSync,mkdirSync,writeFileSync,existsSync} from 'node:fs';
    import {resolve,dirname} from 'node:path';
    import {createHash} from 'node:crypto';
    const input=JSON.parse(readFileSync(0,'utf8'));
    const setup=input.setup.find(r=>r.this==='id:terminal/setup');
    if(!setup)throw Error('Missing id:terminal/setup');
    const manifest=JSON.parse(setup.manifest),expected=new Map(manifest.map(f=>[f.path,f]));
    const rows=input.files.filter(f=>f.version===setup.version);
    if(rows.length!==expected.size)throw Error('File count mismatch');
    const seen=new Set();
    for(const f of rows){
     if(!/^[a-zA-Z0-9_.\/-]+$/.test(f.path)||f.path.startsWith('/')||f.path.split('/').some(p=>!p||p==='.'||p==='..')||seen.has(f.path))throw Error('Unsafe or duplicate path');
     const want=expected.get(f.path),hash=createHash('sha256').update(f.content).digest('hex');
     if(!want||hash!==want.sha256||hash!==f.sha256||Buffer.byteLength(f.content)!==want.bytes)throw Error('Integrity mismatch: '+f.path);
     seen.add(f.path);
    }
    if(!process.argv[2])throw Error('Pass a fresh destination directory');
    const dest=resolve(process.argv[2]);if(existsSync(dest))throw Error('Destination already exists; choose a fresh directory');
    mkdirSync(dest,{mode:0o700});
    for(const f of rows){const path=resolve(dest,f.path);mkdirSync(dirname(path),{recursive:true,mode:0o700});writeFileSync(path,f.content,{flag:'wx',mode:0o600})}
    console.log('Extracted terminal setup '+setup.version+' ('+rows.length+' verified files) into '+dest);
    

terminal/setup-file!:
  this: id:terminal/setup-file/1.0.0/agent/hub.mjs
  version: "1.0.0"
  path: "agent/hub.mjs"
  sha256: "c3286cf926908579f507ba3d6a219bc705d07927aa3d4488c8468d1c16303b69"
  content: |
    #!/usr/bin/env bun
    // hub.mjs — Live wire v2's switchboard (SPEC §7/§10/§13; docs/PROTOCOL.md
    // is the normative contract for every frame, op, and row here).
    //
    //   bun agent/hub.mjs --spot goblin-mode [--terminal]
    //        [--terminal-shell /bin/zsh] [--terminal-cwd ~/x]
    //        [--turn turn:host:3478] [--max-sessions 8] [--agent name]
    //
    // One process, five duties, none of them chat-aware:
    //   · answerer   — polls rtc/signal for kind:call rows, auto-answers each
    //                  fresh one (libdatachannel answers on setRemoteDescription
    //                  alone), publishes the accept, reaps the silent, sweeps
    //                  the stale. Steady state of a healthy spot: zero rows.
    //   · socket door— ${TMPDIR}/tonk-hub-<spot>.sock, NDJSON; ops (c:) are
    //                  management, frames (t:) enter the same bus as card
    //                  frames. This is the responder's and live.mjs's door.
    //                  The ops include the BRANCH DOOR (assert/query/sync):
    //                  a spot's local store is single-writer, so the hub is
    //                  the only process that may run `tonk` against it and
    //                  every other local process asks the hub instead.
    //   · bus        — term-* to the broker; ping/pong terminated here;
    //                  everything else forwarded VERBATIM: consumer frames to
    //                  services, service frames to consumers. Never parsed.
    //   · broker     — one term-open = one tmux client under a PTY in the
    //                  pty-host child (node, never bun), scoped to
    //                  (connection, session); term-out only to attached
    //                  connections; close detaches, kill ends.
    //   · projection — `tmux -L tonk-<spot> ls` every ~2s reconciled into
    //                  term/session facts (named entities, hub = only writer).
    //                  There is NO periodic heartbeat: every branch write here
    //                  is event-driven, because write cadence — not payload —
    //                  is what grew the store 20 GB in three days
    //                  (docs/POSTMORTEM-2026-08-08.md). Liveness is proven by
    //                  the wire itself: slots are swept at boot and retracted
    //                  on shutdown, so a rendered slot row is the "a hub is
    //                  here" signal the beat used to be.
    //
    // Restart freely: sessions live in tmux, chat lives on the branch, and
    // every connection re-establishes from the caller's side. Nothing here
    // may average those guarantees together.
    
    import net from "node:net";
    import { spawn, execFile, execFileSync } from "node:child_process";
    import { createInterface } from "node:readline";
    import { accessSync, constants, existsSync, unlinkSync } from "node:fs";
    import { tmpdir, hostname, networkInterfaces } from "node:os";
    import { delimiter, dirname, join, resolve as pathResolve } from "node:path";
    import { fileURLToPath } from "node:url";
    import { createRequire } from 'node:module';
    import { configureTerminalNamespace, terminalEnvironment } from './terminal-config.mjs';
    import { terminalTitle } from './terminal-title.mjs';
    
    // The one native dependency; optional so a socket-only hub still runs.
    let ndc = null;
    try { ndc = (await import("node-datachannel")).default; } catch { /* warned in start() */ }
    
    // ---- tiny helpers -----------------------------------------------------
    
    const hhmmss = () => new Date().toTimeString().slice(0, 8);
    const defaultLog = (m) => console.log(`[${hhmmss()}] ${m}`);
    
    // asserted-notation string literal (ported from tonk-agent.mjs): the doc
    // is one -c argument, so real newlines must become \n escapes. Backslash
    // and quote first; order matters.
    export const q = (s) =>
      `"${String(s)
        .replace(/\\/g, "\\\\")
        .replace(/"/g, '\\"')
        .replace(/\n/g, "\\n")
        .replace(/\r/g, "\\r")
        .replace(/\t/g, "\\t")}"`;
    
    const clamp = (n, lo, hi, dflt) => {
      const v = Math.round(Number(n));
      return Number.isFinite(v) ? Math.min(hi, Math.max(lo, v)) : dflt;
    };
    
    const KEY_RE = /^[a-z0-9-]+$/;          // PROTOCOL §1: every key input
    const CONCEPT_RE = /^[a-z][a-z0-9]*(?:[/_-][a-z0-9]+)*$/i;   // `chat/message`, `term/session`
    const MAX_NOTATION = 1 << 20;           // 1MB of asserted notation per assert op
    const mintKey = () => `s-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 6)}`;
    
    export function shortHostname() {
      try { return (hostname() || "hub").split(".")[0]; } catch { return "hub"; }
    }
    
    function parseArgs(argv) {
      const FLAGS = { terminal: "terminal", "no-sync": "noSync" };
      const out = {};
      for (let i = 0; i < argv.length; i++) {
        const a = argv[i];
        if (!a.startsWith("--")) continue;
        const key = a.slice(2);
        if (FLAGS[key]) { out[FLAGS[key]] = true; continue; }
        out[key] = argv[++i];
      }
      return out;
    }
    const numArg = (v, d) => { const n = Number(v); return Number.isFinite(n) && n > 0 ? n : d; };
    
    // tmux via PATH with the known homebrew fallback (same as pty-host.mjs).
    function resolveTmux() {
      const dirs = (process.env.PATH || "").split(delimiter).filter(Boolean);
      dirs.push("/opt/homebrew/bin");
      for (const d of dirs) {
        const p = join(d, "tmux");
        try { accessSync(p, constants.X_OK); return p; } catch { /* keep looking */ }
      }
      return null;
    }
    
    // The pty-host child must run under NODE (node-pty ENXIOs under bun).
    function resolveNode() {
      if (!process.versions.bun) return process.execPath;
      const dirs = (process.env.PATH || "").split(delimiter).filter(Boolean);
      dirs.push("/opt/homebrew/bin");
      for (const d of dirs) {
        const p = join(d, "node");
        try { accessSync(p, constants.X_OK); return p; } catch { /* keep looking */ }
      }
      return null;
    }
    
    // SPEC §4: tmux ≥3.2 or --terminal is refused loudly at boot.
    function tmuxCheck(TMUX) {
      if (!TMUX) return { ok: false, why: "tmux not found (PATH + /opt/homebrew/bin)" };
      let out;
      try { out = execFileSync(TMUX, ["-V"], { stdio: ["ignore", "pipe", "pipe"] }).toString().trim(); }
      catch (e) { return { ok: false, why: `tmux -V failed: ${e.message}` }; }
      const m = out.match(/(\d+)\.(\d+)/);
      if (m) {
        const maj = Number(m[1]), min = Number(m[2]);
        if (maj < 3 || (maj === 3 && min < 2))
          return { ok: false, why: `${out} is older than 3.2 (need modern attach/redraw semantics)` };
      }
      return { ok: true, version: out, why: null };
    }
    
    // ---- branch I/O seam --------------------------------------------------
    // Everything the hub says to or hears from the branch goes through this
    // object, so the harness can stub it wholesale. The real one is ported
    // from tonk-agent.mjs: single-flighted tonk CLI for reads, writes and network
    // syncs, with bounded local batches and one sync loop that owns
    // pull/push (a healthy push measured 48s wall on this store 2026-08-07 —
    // NOT the ~8s the first version assumed — so it is batched, gated, and
    // backed off on failure; publishNow jumps the queue for rows a caller is
    // actively waiting on).
    
    export function createBranchIO({ spot, log = defaultLog, syncGapMs = 1200, beatPushMs = 30000, noSync = false, runCommand } = {}) {
      const cli = runCommand ? null : createRequire(import.meta.url).resolve(
        `@tonk/cli-${process.platform}-${process.arch}/bin/${process.platform === 'win32' ? 'tonk.exe' : 'tonk'}`);
      function runTonk(argv, { timeoutMs = 60000 } = {}) {
        if (runCommand) return runCommand(argv, { timeoutMs });
        return new Promise((resolveP, rejectP) => {
          // Use this repository's pinned staging CLI, without npx startup or fetching.
          // Spawn the installed native binary itself so timeout signals reach it,
          // rather than killing a JS launcher and leaving its native child running.
          const proc = spawn(cli, argv, {
            stdio: ["ignore", "pipe", "pipe"],
            // TONK_SPOT works across CLI versions; --spot was dropped in 0.6.5.
            env: spot ? { ...process.env, TONK_SPACE: spot } : process.env,
          });
          let out = "", err = "", killed = false;
          proc.stdout.on("data", (d) => { out += d; });
          proc.stderr.on("data", (d) => { err += d; });
          const killer = setTimeout(() => { killed = true; try { proc.kill(); } catch { /* gone */ } }, timeoutMs);
          proc.on("error", (e) => { clearTimeout(killer); rejectP(new Error(`tonk ${argv[0]}: ${e.message}`)); });
          proc.on("close", (code) => {
            clearTimeout(killer);
            // A killed CLI usually produced NO output, and the old message was
            // therefore empty — "push failed: " told nobody that the real
            // problem was a 48s push against a 45s timeout (2026-08-07).
            if (killed) rejectP(new Error(`tonk ${argv[0]}: killed after ${Math.round(timeoutMs / 1000)}s (CLI still running — timeout too short for this store?)`));
            else if (code !== 0) rejectP(new Error(`tonk ${argv.slice(0, 2).join(" ")}: ${(err || out).trim().slice(0, 300) || `exit ${code} with no output`}`));
            else resolveP(out);
          });
        });
      }
    
      // WRITE/NETWORK lane: strictly serialized. A spot's local store is
      // single-writer, and pull/push move the same state the writes touch.
      let chain = Promise.resolve();
      function enqueue(run) {
        const result = chain.then(run, run);   // serialized; one failure never wedges the next
        chain = result.then(() => {}, () => {});
        return result;
      }
      const tonk = (argv, opts) => enqueue(() => runTonk(argv, opts));
    
      // The September staging CLI refreshes native signing-session state even
      // when opening a space for a query. Reads therefore share the write/sync
      // queue; a separate read lane races the account-store lock.
      const tonkRead = (argv, opts) => tonk(argv, opts);
    
      const evalLocal = (doc) => tonk(["eval", "-q", "--no-sync", "-c", doc]);
    
      // tonk 0.6.5 returns a flat array; older CLIs wrap rows in
      // matches_after[].results[].fields. Read both (the old parse on the new
      // CLI silently yields [] — the "no cards on the board" bug).
      async function readQuery(run, concept) {
        const out = await run(["query", concept, "--json"]);
        const doc = JSON.parse(out);
        if (Array.isArray(doc)) return doc;
        const rows = [];
        for (const m of doc.matches_after ?? [])
          for (const r of m.results ?? []) rows.push({ this: r.this, ...(r.fields ?? {}) });
        return rows;
      }
      const query = concept => readQuery(tonkRead, concept);
    
      async function readMany(run, shapes) {
        if (!shapes || Array.isArray(shapes) || typeof shapes !== 'object') throw new Error('Invalid query shapes');
        const concepts = Object.keys(shapes);
        if (concepts.some(c => !/^[a-zA-Z0-9_./-]+$/.test(c) || !Array.isArray(shapes[c]) ||
          shapes[c].some(f => typeof f !== 'string' || !/^[a-zA-Z][a-zA-Z0-9_-]*$/.test(f) || f === 'this'))) throw new Error('Invalid query concepts');
        // Keep legacy/admin query groups independent. Native 0.6.15 rejects bare
        // heads; even `concept: {}` heads (including separate YAML documents) join
        // implicitly and can omit closed instances. The isolated parity test
        // catches this. Protocol-2 browser language commands never call this path.
        const rows = {};
        for (const concept of concepts) rows[concept] = await readQuery(run, concept);
        return rows;
      }
      const queryMany = shapes => localBatch(local => local.queryMany(shapes));
    
      // Reserve one position in the native-store queue. Syncs and other callers
      // cannot interleave these local operations. Never await a model/network call
      // here or call the outer io.query/evalLocal from a batch (it would deadlock).
      // The scoped facade serializes even accidentally concurrent local calls.
      const localBatch = fn => enqueue(async () => {
        let active = true, localChain = Promise.resolve();
        const run = (argv, opts) => {
          if (!active) return Promise.reject(new Error('Local batch is closed'));
          const result = localChain.then(() => runTonk(argv, opts));
          localChain = result.then(() => {}, () => {});
          return result;
        };
        try {
