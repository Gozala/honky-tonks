---
concept!:
  this: concept:branch
  description: "A branch on some replica (see `tonk:replica`). Individual replicas can\ncreate same-named branches that sit at different revisions, which is\nwhy a branch is unique per replica rather than per repository.\n"
  with:
    edition:
      the: dialog.branch/edition
      as: unsigned-integer
      cardinality: one
      description: "Causal depth (Lamport edition) of the current revision"
    name:
      the: dialog.branch/name
      as: text
      cardinality: one
      description: "The branch name"
    replica:
      the: dialog.branch/replica
      as: entity
      cardinality: one
      description: "The replica this branch belongs to"
    revision:
      the: dialog.branch/revision
      as: entity
      cardinality: one
      description: "The current revision entity of this branch"
    tree:
      the: dialog.branch/tree
      as: entity
      cardinality: one
      description: "The tree root of this branch"

