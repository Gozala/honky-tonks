      description: "The space name shown on its pill"

---
concept!: &deck/rename
  this: concept:44g78P3WdCmn7b7dKPQbmhazggSuy21Y2hC2jQLtcqRz
  description: "Rename the deck to `name`."
  with:
    name:
      the: dom.event.detail/deck-name
