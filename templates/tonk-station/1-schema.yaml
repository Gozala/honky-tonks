---
concept!:
  this: tonk:seed/available
  description: "A seed that exists, and where its bytes came from."
  with:
    replaces:
      the: xyz.tonk.seed/replaces
      as: entity
      cardinality: one
      description: "The installed seed this one would supersede — the backlink that makes an available seed answerable on its own (\"this is an update to what you are running\") rather than only by joining it against the space's install record.\n"
    source:
      the: xyz.tonk.seed/source
      as: text
      cardinality: one
      description: "Where these bytes were fetched from. The entity is the content hash alone, so the source rides alongside because a custom seed is a different URL at the same shape.\n"

---
concept!:
  this: tonk:seed/installed
  description: "The seed a space is running — what an upgrade withdraws."
  with:
    prior:
      the: xyz.tonk.seed/prior
      as: entity
      cardinality: one
      description: "The seed this one replaced, or `seed:none` on a first install — present on every seed rather than absent on the first, so the chain reads uniformly.\n"
    version:
      the: xyz.tonk.seed/version
      as: text
      cardinality: one
      description: "The version of the commit that installed this seed. A version, not a revision: a revision includes the tree its commit produces, so a fact inside a commit can never name it, while a version is knowable before the batch is written — which is what lets this record ride the same commit as the claims it describes.\nIt is also the record of WHAT the seed installed, since a commit's history lists every claim it wrote.\n"

