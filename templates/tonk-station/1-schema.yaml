      description: "The new workspace title"

---
concept!:
  this: concept:4CbM7AVYZCoAJgzfVhX3grNeNAHE7Pp5n8cimVAK3Fwz
  description: "Create a new instance of artifact `kind` in deck `deck`, placed in the column with key `column`."
  with:
    column:
      the: dom.event.detail/deck-card-column
      as: text
      cardinality: one
      description: "The `key` of the column the artifact lands in"
    content:
      the: dom.event.detail/deck-card-content
      as: text
      cardinality: one
      description: "Initial content as JSON text. kind text: {\"markdown\": \"...\"}. kind table: {\"content\": \"<CSV>\"}."
    deck:
      the: dom.event.detail/deck-card-deck
      as: text
      cardinality: one
      description: "The `key` of the deck the new instance belongs to"
    kind:
      the: dom.event.detail/deck-card-kind
      as: text
      cardinality: one
      description: "Artifact kind: text (a markdown note, content {\"markdown\": \"...\"}) or table (content {\"content\": \"<CSV>\"})"
    order:
      the: dom.event.detail/deck-card-order
      as: text
      cardinality: one
      description: "Artifact order key, computed by the component"
    time:
      the: dom.event.detail/time
      as: unsigned-integer
      cardinality: one
      description: "A monotonic integer nonce from the component"

---
concept!: &vault/node
  this: concept:4aPQ5xjcrbsm3J8g65tx8XgSUqneL46TR2623atjAruf
  description: "A node in the text artifact's file tree - a folder or a file."
