      cardinality: one
      description: "Component-minted opaque token for the tree node"
    kind:
      the: dom.event.detail/deck-node-kind
      as: text
      cardinality: one
      description: "Tree node kind: \"folder\" or \"deck\""
    name:
      the: dom.event.detail/deck-node-name
      as: text
      cardinality: one
      description: "Initial tree node name"
    order:
      the: dom.event.detail/deck-node-order
      as: text
      cardinality: one
      description: "Tree node order key among its siblings, computed by the component"
    parent:
      the: dom.event.detail/deck-node-parent
      as: text
      cardinality: one
      description: "The `key` of the parent folder, or the sentinel \"root\""
    time:
      the: dom.event.detail/time
      as: unsigned-integer
      cardinality: one
      description: "A monotonic integer nonce from the component"

