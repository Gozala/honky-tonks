---
concept!: &term/session
  this: concept:4rerCAmVaE2PPzbUshfiiWZqGr2M97dRkKzWXDgX6fP7
  description: "One terminal session in the tonk tmux namespace, as the hub last projected it from tmux ls"
  with:
    born:
      the: xyz.tonk.term.session/born
      as: text
      cardinality: one
      description: "When the session was created, milliseconds since the Unix epoch as a decimal string"
    key:
      the: xyz.tonk.term.session/key
      as: text
      cardinality: one
      description: "The tmux session name; a terminal card stores it as its card content, the way an agent card stores a thread key"
    origin:
      the: xyz.tonk.term.session/origin
      as: text
      cardinality: one
      description: "Which door created it: deck | socket:<client> | tmux"
    seen:
      the: xyz.tonk.term.session/seen
      as: text
      cardinality: one
      description: "When the hub's sweep last saw it in tmux ls, milliseconds since the Unix epoch as a decimal string; keeps abandonment visible"
    status:
      the: xyz.tonk.term.session/status
      as: text
      cardinality: one
      description: "running | exited (gone from tmux ls, kept a while for resurrection) | lost (the tmux server died under it)"
    title:
      the: xyz.tonk.term.session/title
      as: text
      cardinality: one
      description: "Human label: creator-set at birth, else the hub keeps it at the session's pane_current_command"

---
concept!: &deck/create-column
  this: concept:4voHw3mCX8WcEUaHakRUKjcNqbSJ6t776qCfGSu215qk
  description: "Create a new column on the strip. Transient so later commits cannot replay the creation."
  with:
    key:
      the: dom.event.detail/deck-col-key
      as: text
      cardinality: one
      description: "Component-minted opaque token for the column"
    order:
      the: dom.event.detail/deck-col-order
      as: text
      cardinality: one
      description: "Column order key, computed by the component"
    space:
      the: dom.event.detail/deck-col-space
      as: text
      cardinality: one
      description: "The `key` of the space the column belongs to"
    time:
      the: dom.event.detail/time
      as: unsigned-integer
      cardinality: one
      description: "A monotonic integer nonce from the component"
    width:
      the: dom.event.detail/deck-col-width
      as: text
      cardinality: one
      description: "Initial width fraction, as text"

---
concept!: &deck/create-node
  this: concept:4wqRkxaqMCS1wR5foNBrz39SazET6z1S1RdEiBJFvoSP
