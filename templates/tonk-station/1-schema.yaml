      the: xyz.tonk.authorization/proof
      as: text
      cardinality: one
      description: "base58 delegation chain — the `?access=` part of the invite URL."
    account:
      the: xyz.tonk.agent-invite/account
      as: entity
      cardinality: one
      description: "The account required by legacy handoffs; unused by bearer invitations."
    code:
      the: xyz.tonk.credential/seed
      as: text
      cardinality: one
      description: "base58 keypair seed — the `#` fragment of the invite URL."
    link:
      the: xyz.tonk.agent-invite/link
      as: text
      cardinality: one
      description: "The complete agent invitation URL."
    name:
      the: xyz.tonk.repo/name
      as: text
      cardinality: one
      description: "The repository's display name. Seeded at creation (the worker writes it into the repo's own `tonk/repository` on the content branch) and carried over sync on join, so a real repository always has one; the banner still falls back to \"Untitled\" if a read races ahead of the fact.\n"
