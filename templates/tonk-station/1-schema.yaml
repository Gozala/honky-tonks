    title:
      the: dom.event.detail/deck-retitle-title
      as: text
      cardinality: one
      description: "The instance's new title (never blank — a blank field is dropped from a command; clearing goes through untitle-instance)"

---
concept!: &deck/column-order
  this: concept:4oUShUrTBmxCT21F4og11GvAPrx8kn1fo5BabVyhNYrf
  description: "A deck column's order key, as a standalone fact."
  with:
    order:
      the: xyz.tonk.deck.column/order
      as: text
