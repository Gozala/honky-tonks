      description: "A short description written by the space owner."
    name:
      the: xyz.tonk.repo/name
      as: text
      cardinality: one
      description: "The repository's display name. Seeded at creation (the worker writes it into the repo's own `tonk/repository` on the content branch) and carried over sync on join, so a real repository always has one; the banner still falls back to \"Untitled\" if a read races ahead of the fact.\n"

