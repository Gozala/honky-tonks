# ---- 01-schema.yaml ----
# Every concept with its attributes inline: one statement per concept, so the
# whole template evaluates quickly as one document.

---
concept!: &chat/send
  this: concept:12rBQewkxhLuxvwKziQMUTBCKo5W7GDtbVsDCZiLDFEx
  with:
    role:
      the: dom.event.detail/chat-role
      as: text
      cardinality: one
      description: "Speaker role for the minted message; the composer sends user"
    say:
      the: dom.event.detail/chat-say
      as: text
      cardinality: one
      description: "The composed message text, from the event detail"
    stamp:
      the: dom.event.detail/chat-stamp
      as: text
      cardinality: one
      description: "Send time in ms since the Unix epoch, as a decimal string; keeps repeat sends distinct"
    thread:
      the: dom.event.detail/chat-thread
      as: text
      cardinality: one
      description: "Thread the message belongs to, from the event detail"

---
concept!: &chat/unplug
  this: concept:27dQCShJkrhZ5w8JzbanF7ZWZcxJQ1i9sCqHciZtBL1s
  with:
    presence:
      the: dom.event.detail/chat-unplug
      as: entity
      cardinality: one
      description: "The agent/presence entity to retract, from the event detail"

---
